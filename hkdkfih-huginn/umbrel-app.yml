category: automation
name: Huginn
version: "2026.11.18"
tagline: Build agents that monitor and act on your behalf
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-huginn/icon.png
description: >-
  Log in with the username "umbrel" and the password shown by Umbrel.


  Huginn is a system for building agents that perform automated tasks for you online. They watch websites, feeds and APIs, wait for events, and act: send digests, post to chat, call webhooks or chain into other agents. Think of it as a hackable, self-hosted IFTTT or Zapier.


  - Dozens of agent types: website scraping, RSS, weather, email, Twitter/X, MQTT, webhooks and more

  - Chain agents into scenarios and share them

  - Liquid templating to shape events and messages

  - Schedules, event history and a dry-run mode


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 10 GB
releaseNotes: >-
  - This security release restricts how Agents use instance credentials and what non-admin Agents can serve from the Huginn domain.


  Security fixes


  - Send the instance-wide OPENAI_API_KEY only to the origin configured by OPENAI_BASE_URL, which defaults to the OpenAI API. Use an Agent-specific key for another origin that requires authentication. If untrusted users could configure OpenAI Agents while the instance key was set, rotate that key.

  - Restrict active web responses and external redirects to administrator-owned Agents by default, including Webhook and Liquid Output Agents. Non-admin Agent responses keep plain text, JSON, and same-origin redirects. RSS, Atom, and XML are served as attachments.

  - Give each Google Calendar Publish Agent its own service account credentials. Agents that used the worker's default Google credentials or an unrestricted server-side key file need to migrate.

  - …


  Full release notes: https://github.com/huginn/huginn/releases/tag/v2026.11.18

