category: automation
name: Huginn
version: "2026.10.24"
tagline: Build agents that monitor and act on your behalf
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-huginn/icon.png
description: >-
  Log in with the username "umbrel" and the password shown by Umbrel.


  Huginn is a system for building agents that perform automated tasks for you online. They watch websites, feeds and APIs, wait for events, and act: send digests, post to chat, call webhooks or chain into other agents. Think of it as a hackable, self-hosted IFTTT or Zapier.


  - Dozens of agent types: website scraping, RSS, weather, email, Twitter/X, MQTT, webhooks and more

  - Chain agents into scenarios and share them

  - Liquid templating to shape events and messages

  - Schedules, event history and a dry-run mode


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 10 GB
releaseNotes: >-
  v2026.10.24


  - Ruby 4.0.9 includes fixes for memory corruption when compiling attacker-controlled regular expressions. See the Ruby advisory for details.

  - Upgrade Ruby to 4.0.9, including the official Docker images.

  - Upgrade the bundled MySQL server to 8.4.13.

  - Select the web interface language with the LOCALE environment variable. Translations come from an additional gem, with English fallbacks for missing translations.

  - Update Docker latest tags only after a release passes the Docker specs. Builds from the development branch use the master tag instead.

  - Refresh Smokescreen, Ruby gems, and npm dependencies, including JSON 3.1.0, OmniAuth 2.3.1, and janeway-jsonpath 1.2.0.


  Upgrading


  - For a manual installation, install Ruby 4.0.9 before updating the bundle. The official Docker images include the updated runtime.

  - …


  Full release notes: https://github.com/huginn/huginn/releases/tag/v2026.10.24

