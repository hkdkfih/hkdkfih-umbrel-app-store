category: automation
name: Huginn
version: "2026.11.09"
tagline: Build agents that monitor and act on your behalf
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-huginn/icon.png
description: >-
  Log in with the username "umbrel" and the password shown by Umbrel.


  Huginn is a system for building agents that perform automated tasks for you online. They watch websites, feeds and APIs, wait for events, and act: send digests, post to chat, call webhooks or chain into other agents. Think of it as a hackable, self-hosted IFTTT or Zapier.


  - Dozens of agent types: website scraping, RSS, weather, email, Twitter/X, MQTT, webhooks and more

  - Chain agents into scenarios and share them

  - Liquid templating to shape events and messages

  - Schedules, event history and a dry-run mode


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 10 GB
releaseNotes: >-
  - This security release fixes server environment disclosure through JqAgent and bypasses of the enforced outbound proxy. Upgrade installations that enable JqAgent or rely on OUTBOUND_PROXY to restrict users' outbound requests.


  Security fixes


  - JqAgent now starts jq with an empty environment. User filters can no longer read server environment variables through env or $ENV. This affects installations with jq support enabled through USE_JQ.

  - Enforce OUTBOUND_PROXY for HTTParty, open-uri and directly built Net::HTTP connections, including JiraAgent and WeiboPublishAgent. These paths previously bypassed the configured proxy, allowing users to reach destinations it was intended to block. The fix also covers related paths in StubhubAgent and default Scenario imports.

  - Thanks to @akash111-hue for reporting both issues.

  - …


  Full release notes: https://github.com/huginn/huginn/releases/tag/v2026.11.09

