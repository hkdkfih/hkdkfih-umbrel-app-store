category: automation
name: Huginn
version: "2026.11.05.2"
tagline: Build agents that monitor and act on your behalf
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-huginn/icon.png
description: >-
  Log in with the username "umbrel" and the password shown by Umbrel.


  Huginn is a system for building agents that perform automated tasks for you online. They watch websites, feeds and APIs, wait for events, and act: send digests, post to chat, call webhooks or chain into other agents. Think of it as a hackable, self-hosted IFTTT or Zapier.


  - Dozens of agent types: website scraping, RSS, weather, email, Twitter/X, MQTT, webhooks and more

  - Chain agents into scenarios and share them

  - Liquid templating to shape events and messages

  - Schedules, event history and a dry-run mode


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 10 GB
releaseNotes: >-
  - This security release upgrades Rails from 8.1.4 to 8.1.4.1 and updates its HTML sanitization dependencies. We recommend upgrading all installations.


  Security fixes


  - Rails 8.1.4.1 addresses 21 security issues, including XSS, IP spoofing, denial of service, session handling, and Active Storage file processing vulnerabilities. Exposure depends on the features and deployment configuration in use. See the Rails security release announcement for details.

  - The update also includes rails-html-sanitizer 1.7.2, Loofah 2.25.3, and Nokogiri 1.19.7.


  Upgrade notes


  - No database migration is required. Update to v2026.11.05.2 and restart Huginn's processes, or pull and recreate containers using the official release images.

  - …


  Full release notes: https://github.com/huginn/huginn/releases/tag/v2026.11.05.2

