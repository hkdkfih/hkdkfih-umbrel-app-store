category: automation
name: Huginn
version: "2026.10.14"
tagline: Build agents that monitor and act on your behalf
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-huginn/icon.png
description: >-
  Log in with the username "umbrel" and the password shown by Umbrel.


  Huginn is a system for building agents that perform automated tasks for you online. They watch websites, feeds and APIs, wait for events, and act: send digests, post to chat, call webhooks or chain into other agents. Think of it as a hackable, self-hosted IFTTT or Zapier.


  - Dozens of agent types: website scraping, RSS, weather, email, Twitter/X, MQTT, webhooks and more

  - Chain agents into scenarios and share them

  - Liquid templating to shape events and messages

  - Schedules, event history and a dry-run mode


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 10 GB
releaseNotes: >-
  v2026.10.14


  - Show maps of location Events with OpenStreetMap and Leaflet when UserLocationAgent has no Google Maps api_key, instead of showing no map.

  - Upgrade the PostgreSQL Docker Compose example from PostgreSQL 9.5 to 18.

  - Move the Heroku setup to the heroku-24 stack and Heroku's native multi-buildpack support.

  - Remove the OpenShift and Cloud Foundry deployment files, whose platforms are no longer available.

  - Rewrite the README and deployment documentation around Docker, and add a security policy, a contributing guide, and a sponsors page.

  - Stop the bundled MySQL server in the multi-process image together with its child processes, so that leftover socket locks no longer prevent the next start.

  - Run the Docker specs against a release's images before tagging them with the release version.

  - …


  Full release notes: https://github.com/huginn/huginn/releases/tag/v2026.10.14

