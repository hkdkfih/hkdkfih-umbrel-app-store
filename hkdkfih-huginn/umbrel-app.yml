manifestVersion: 1
id: hkdkfih-huginn
storage:
  dataRoot: data
category: automation
name: Huginn
version: "2026.10.26"
tagline: Build agents that monitor and act on your behalf
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-huginn/icon.png
description: >-
  Log in with the username "umbrel" and the password shown by Umbrel.


  Huginn is a system for building agents that perform automated tasks for you online. They watch websites, feeds and APIs, wait for events, and act: send digests, post to chat, call webhooks or chain into other agents. Think of it as a hackable, self-hosted IFTTT or Zapier.


  - Dozens of agent types: website scraping, RSS, weather, email, Twitter/X, MQTT, webhooks and more

  - Chain agents into scenarios and share them

  - Liquid templating to shape events and messages

  - Schedules, event history and a dry-run mode


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 10 GB
releaseNotes: >-
  v2026.10.26


  - This release updates certificate trust following the eMudhra intermediate CA incident. Docker builds now require Ubuntu's corrected CA package, and gRPC connections prefer the OS trust store over the gem's bundled certificates.

  - Require ca-certificates version 20260816ubuntu0.24.04.1 or later in the Ubuntu 24.04 Docker images. Builds fail if the update is unavailable. See USN-8944-1.

  - Prefer OS CA certificates for gRPC connections. Explicit gRPC trust settings remain supported.

  - Use Active Record validation for service-name sort directions.

  - Add responsive scenario and service filters to the Agents page, including agents without a scenario.

  - Pass through events when DeDuplicationAgent's configured property renders to an empty string, without remembering them as duplicates.

  - Interpolate Basic Authentication values during web request validation.

  - …


  Full release notes: https://github.com/huginn/huginn/releases/tag/v2026.10.26

