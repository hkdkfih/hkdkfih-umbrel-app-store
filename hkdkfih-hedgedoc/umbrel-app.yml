manifestVersion: 1
id: hkdkfih-hedgedoc
storage:
  dataRoot: data
category: files
name: HedgeDoc
version: "1.12.3"
tagline: Collaborative Markdown notes in real time
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-hedgedoc/icon.png
description: >-
  On first launch, click "Sign In" and register an account with any email address and password.


  HedgeDoc lets you write notes, documentation and presentations together, in Markdown, in real time. Share a link and everyone sees changes instantly.


  - Live collaborative editing with a split preview

  - Diagrams (Mermaid, PlantUML), math, charts and syntax highlighting

  - Turn any note into a slide deck

  - Fine-grained permissions: private, locked, editable or published notes

  - Revision history and image uploads


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 512 MB → 1 GB

  Storage: 1 GB → 5 GB
releaseNotes: >-
  - This release should fix the bugs in the withdrawn releases 1.12.1 and 1.12.2 by repairing the database.

  - Therefore, please inspect the release notes for 1.12.1 and 1.12.2 as well.

  - Note: This release changes the local database to enforce uniqueness on the email column for local accounts.

  - In theory your instance should not have duplicate email addresses. However, it might be good to ensure this is

  - true for your database as well and remove duplicate user entries otherwise.

  - The repair migrations - especially for SQLite - are a bit overcautious in order to not destroy any data.

  - In case your database has some weird situation which the repair does not recognize, it might abort and print a

  - message to the log. So, please check your log on the first start of your instance after this update.

  - Also remember to create a backup before updating.

  - …


  Full release notes: https://github.com/hedgedoc/hedgedoc/releases/tag/1.12.3

