version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-sqlpage_server_1
      APP_PORT: 8080

  server:
    image: lovasoa/sqlpage:v0.47.0@sha256:88a535d169d2cc5a12c17cff76992dd5c1b3c20864ce5a5e729b070990b37fe5
    user: "1000:1000"
    restart: on-failure
    environment:
      DATABASE_URL: sqlite:///var/www/sqlpage.db?mode=rwc
    volumes:
      - ${APP_DATA_DIR}/data/www:/var/www
