version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-sqlpage_server_1
      APP_PORT: 8080

  server:
    image: lovasoa/sqlpage:v0.48.0@sha256:ab972cb8e0090458f7d528c7fc41f2311c2daf6a8d7e1895cf4b4e7cd2d63c1f
    user: "1000:1000"
    restart: on-failure
    environment:
      DATABASE_URL: sqlite:///var/www/sqlpage.db?mode=rwc
    volumes:
      - ${APP_DATA_DIR}/data/www:/var/www
