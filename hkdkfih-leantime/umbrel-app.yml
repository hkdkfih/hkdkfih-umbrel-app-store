category: files
name: Leantime
version: "3.15.0"
tagline: Project management for the rest of us
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-leantime/icon.png
description: >-
  On first launch, Leantime opens its installer: create your company and admin account in the browser.


  Leantime is a goals-focused project management system for non-project managers, built with ADHD, autism and dyslexia in mind. It combines strategy, planning and execution in one simple tool.


  - Kanban boards, tables, lists and Gantt timelines

  - Goals, milestones and idea boards

  - Timesheets and a personal "My Work" dashboard

  - Docs, wikis, retrospectives and file sharing


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 10 GB
releaseNotes: >-
  Version: 3.15.0


  New Features


  - Permission-based controls for canvas boards, ideas and docs - Blueprint boards, goals, ideas and Docs show their create, edit and delete controls by the permissions of the item's own project, so custom roles see only what they can use

  - Permission checks for comments, files, tokens and imports - Comments, files, personal access tokens, CSV imports and integrations check specific permissions instead of role rank

  - forms.field component - A new forms.field component bundles label, control and help text; user, client, API key and 22 dialog forms use it (#4003, #4004)


  Improvements


  - Clearer board and table styling - Kanban headers, lanes, group boxes and table headers now stand off the white card for better contrast

  - Accessible field help - Help text under a form field is announced by screen readers with its control

  - …


  Full release notes: https://github.com/Leantime/leantime/releases/tag/v3.15.0

