name: Leantime
version: "3.14.0"
tagline: Project management for the rest of us
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-leantime/icon.png
description: >-
  On first launch, Leantime opens its installer: create your company and admin account in the browser.


  Leantime is a goals-focused project management system for non-project managers, built with ADHD, autism and dyslexia in mind. It combines strategy, planning and execution in one simple tool.


  - Kanban boards, tables, lists and Gantt timelines

  - Goals, milestones and idea boards

  - Timesheets and a personal "My Work" dashboard

  - Docs, wikis, retrospectives and file sharing


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 10 GB
releaseNotes: >-
  Version: 3.14.0


  Granular permission checks across the app


  - Projects, Timesheets, Users, API keys, to-dos, milestones, sprints, the dashboard, and menu items now check specific permissions rather than relying on role rank, giving administrators finer control over what each user can access (#3985, #3988, #3992).


  New Features


  - Calendar plugin extensibility - Calendar events and filters are now class-based, so calendar plugins can hook in reliably. Moving or resizing an event in the calendar now also notifies plugins

  - CalDAV Calendar Sync plugin - New on the marketplace and requires this release: two-way sync with Nextcloud, ownCloud, Baikal or Radicale, and Leantime as a calendar account in Apple Calendar, Thunderbird or DAVx⁵

  - Domain-driven client events - Timesheets and Projects client events are now derived from domain events

  - …


  Full release notes: https://github.com/Leantime/leantime/releases/tag/v3.14.0

