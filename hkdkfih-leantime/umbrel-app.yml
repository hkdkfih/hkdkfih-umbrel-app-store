category: files
name: Leantime
version: "3.13.2"
tagline: Project management for the rest of us
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-leantime/icon.png
description: >-
  On first launch, Leantime opens its installer: create your company and admin account in the browser.


  Leantime is a goals-focused project management system for non-project managers, built with ADHD, autism and dyslexia in mind. It combines strategy, planning and execution in one simple tool.


  - Kanban boards, tables, lists and Gantt timelines

  - Goals, milestones and idea boards

  - Timesheets and a personal "My Work" dashboard

  - Docs, wikis, retrospectives and file sharing


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 10 GB
releaseNotes: >-
  Version: 3.13.2


  New Features


  - Marketplace install reporting - Plugin installations now report their results and server details back to the marketplace

  - Email digest: "New" and "Already seen" - Notifications already read in the inbox move under an "Already seen" heading, and a digest with nothing new is no longer sent

  - Company email frequency is a floor - The company setting no longer overrides a person's own choice; people can make email quieter for themselves, but not more frequent than the company setting


  Bug Fixes


  - Top loader clears after Save & Close - The loading indicator no longer stays active after using Save & Close in a modal

  - Resume owner setup during install - The /install flow can now resume owner setup even after the post-install redirect is lost

  - Correct calendar event times - Event times now follow the user's current time format instead of a stale session copy

  - …


  Full release notes: https://github.com/Leantime/leantime/releases/tag/v3.13.2

