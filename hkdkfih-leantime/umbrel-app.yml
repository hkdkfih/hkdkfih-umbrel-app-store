name: Leantime
version: "3.17.0"
tagline: Project management for the rest of us
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-leantime/icon.png
description: >-
  On first launch, Leantime opens its installer: create your company and admin account in the browser.


  Leantime is a goals-focused project management system for non-project managers, built with ADHD, autism and dyslexia in mind. It combines strategy, planning and execution in one simple tool.


  - Kanban boards, tables, lists and Gantt timelines

  - Goals, milestones and idea boards

  - Timesheets and a personal "My Work" dashboard

  - Docs, wikis, retrospectives and file sharing


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 10 GB
releaseNotes: >-
  Version: 3.17.0


  Morning summaries and reminders


  - Leantime now looks ahead.

  - Morning summary: at most one a day, at each person's chosen time (08:00 by default, in their timezone). It covers:

  - their to-dos that are due

  - milestones a week and a day ahead

  - project end dates, for the project's managers

  - Where it arrives: in the inbox, and by email and push for people who kept those on.

  - Nothing coming up, nothing sent. Overdue work is one quiet line, never a nag.

  - "Remind me" on each to-do: choose how often it reminds you (default, more, less or off) from the to-do's ⋮ menu, the open to-do, or the new Coming up panel, or set your own default.

  - Turning it off: admins can switch reminders off for the whole workspace. It runs on the scheduler, so it needs the cron to be running


  CalDAV that works both ways


  - This release bundles CalDAV 1.1.0 (Leantime/plugins#168).

  - …


  Full release notes: https://github.com/Leantime/leantime/releases/tag/v3.17.0

