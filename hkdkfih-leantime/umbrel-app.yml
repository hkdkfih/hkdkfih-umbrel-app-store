category: files
name: Leantime
version: "3.15.3"
tagline: Project management for the rest of us
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-leantime/icon.png
description: >-
  On first launch, Leantime opens its installer: create your company and admin account in the browser.


  Leantime is a goals-focused project management system for non-project managers, built with ADHD, autism and dyslexia in mind. It combines strategy, planning and execution in one simple tool.


  - Kanban boards, tables, lists and Gantt timelines

  - Goals, milestones and idea boards

  - Timesheets and a personal "My Work" dashboard

  - Docs, wikis, retrospectives and file sharing


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 10 GB
releaseNotes: >-
  Version: 3.15.3


  Bug Fixes


  - Unfinished onboarding - A new owner or invited user who left the welcome steps before the end could not log in ("Username or password incorrect!" with the right password). Logging in with the chosen password now takes them back to the welcome steps to finish

  - Onboarding across sessions - Finishing the welcome steps in a different browser session no longer fails with a server error. It sends the person to log in and finish instead

  - Onboarding messages - Notifications on welcome steps 2–5 no longer show as escaped HTML


  Upgrade Notes


  - No database changes.


  Other Changes


  - fix(auth): finish an onboarding that was left or split across sessions

  - Release v3.15.3


  Full release notes: https://github.com/Leantime/leantime/releases/tag/v3.15.3

