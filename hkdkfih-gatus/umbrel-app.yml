manifestVersion: 1
id: hkdkfih-gatus
storage:
  dataRoot: data
category: networking
name: Gatus
version: "5.38.0"
tagline: A developer-oriented health dashboard and uptime monitor
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-gatus/icon.png
description: >-
  Gatus is configured with a YAML file. It starts with a few example checks of your internet connection; edit
  data/config/config.yaml in the app's data folder (~/umbrel/app-data/hkdkfih-gatus) to add your own
  websites, APIs and devices, and Gatus reloads it automatically.


  Gatus is a health dashboard that lets you monitor your services using HTTP, ICMP, TCP and DNS queries, and
  evaluate the results with conditions on the status code, response time, certificate expiry, body and more.
  When something breaks, it alerts you on the channel of your choice.


  - HTTP, ICMP, TCP, UDP, DNS, SSH, STARTTLS, TLS and WebSocket checks

  - Conditions on status, response time, body (JSON path), certificate and domain expiry

  - Alerts via Slack, Discord, Telegram, Gotify, ntfy, Matrix, email, PagerDuty and dozens more

  - Groups, search, uptime badges, announcements and maintenance windows

  - External endpoints that your scripts and CI jobs can push results to

  - Check history kept in SQLite


  The dashboard is protected by your Umbrel login. Pushes to external endpoints
  (/api/v1/endpoints/…/external) are accepted without it and must carry the endpoint's token.


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 64 MB → 256 MB

  Storage: 100 MB → 1 GB

  Note: Storage grows with the number of endpoints and their check history
releaseNotes: >-
  - feat(alerting): add Resend alerting provider

  - fix(maintenance): validate maintenance windows for external, DNS and SSH endpoints

  - fix(alerting): Redact telegram token from errors on send failure

  - fix(websocket): apply the client timeout to reads and writes

  - fix(ssh): support keyboard-interactive authentication for endpoints and tunnels

  - fix(security): add comprehensive logging and diagnostics for OIDC

  - fix(jsonpath): support object keys containing dots via quoted accessors

  - fix: Honor minimum-reminder-interval for external endpoints


  Full release notes: https://github.com/TwiN/gatus/releases/tag/v5.38.0

