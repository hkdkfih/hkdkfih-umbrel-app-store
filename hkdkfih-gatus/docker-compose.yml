version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-gatus_server_1
      APP_PORT: 8080
      # External endpoints are pushed by your own scripts and CI jobs, which cannot send Umbrel
      # login cookies; each push must carry the endpoint's bearer token from config.yaml.
      PROXY_AUTH_WHITELIST: "/api/v1/endpoints/*/external"

  server:
    image: twinproduction/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # A directory: every *.yaml file in it is merged, starting with the shipped config.yaml.
      GATUS_CONFIG_PATH: /config
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/gatus:/data
