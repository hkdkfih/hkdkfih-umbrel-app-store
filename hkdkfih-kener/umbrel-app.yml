category: networking
name: Kener
version: "4.1.8"
tagline: A stunning, modern status page for your services
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-kener/icon.png
description: >-
  On first launch, click Login and create your account: the first account becomes the admin. Then add
  monitors under Manage → Monitors and put them on a page.


  Kener is a sleek, lightweight status page system. Monitor your websites, APIs and servers, show their uptime
  and latency on beautiful status pages, and keep everyone informed about incidents and maintenance.


  - Website/API, ping, TCP, DNS, SSL certificate, SQL, gRPC, game server, Prometheus and heartbeat monitors

  - 90-day uptime bars, latency charts and status history

  - Incidents and scheduled maintenance with updates and comments

  - Multiple pages, light and dark themes, custom branding and many languages

  - Alerts through webhooks, email and chat services, plus email subscriptions for visitors

  - Embeddable badges and widgets, RSS feeds and a REST API


  Your status pages are behind the Umbrel login. Heartbeat URLs (/ext/heartbeat/…) and the REST API (/api/…,
  which needs a Kener API key) are reachable without it so your machines and scripts can report in.


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 512 MB → 1 GB

  Storage: 1 GB → 5 GB

  Note: Storage grows with monitor history
releaseNotes: >-
  - fix(ci): keep publishing release images when one variant fails

  - fix(ui): keep incident and maintenance duration below the navbar

  - feat(heartbeat): let users set the heartbeat secret

  - fix(api): run the proxy URL check on v4 monitor create and update

  - Test the live demo at kener.ing with surface

  - Remove the surface trial

  - feat(subscriptions): state and impact flags for subscriber mail templates

  - Shrink the agent docs from 183 always-loaded lines to 28, and fix 8 wrong facts

  - Show hidden monitors to signed-in users with monitors.read, and stop inline incidents leaking them

  - fix(monitors): warn when $SECRET is sent over plain http

  - Stop maintenance emails and /maintenances/{id} page data from leaking hidden monitors

  - Stop emailing events that affect only hidden monitors, and count only visible monitors in the incident impact

  - …


  Full release notes: https://github.com/rajnandan1/kener/releases/tag/v4.1.8

