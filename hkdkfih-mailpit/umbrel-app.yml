manifestVersion: 1
id: hkdkfih-mailpit
storage:
  dataRoot: data
category: developer
name: Mailpit
version: "1.33.1"
tagline: Catch and inspect emails sent by your apps
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-mailpit/icon.png
description: >-
  Point the app or script you are testing at the SMTP server umbrel.local, port 21604, and log in with the
  username and password shown by Umbrel (no TLS). Every email it sends lands in Mailpit instead of a real
  inbox. The web interface is protected by your Umbrel login.


  Mailpit is an email and SMTP testing tool for developers. It acts as an SMTP server and gives you a fast,
  modern web interface to view and test the messages it catches, so you can check your emails without
  spamming real people.


  - Real-time inbox with search, tags and read/unread state

  - View HTML, source, text, headers and attachments, on desktop, tablet and phone sizes

  - HTML check shows how well your email is supported across mail clients

  - Link check finds broken links, plus optional SpamAssassin scoring

  - Release a message to a real SMTP server when you need to

  - REST API, webhooks and a sendmail replacement for automated tests


  Mailpit keeps the newest 500 messages by default.


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 64 MB → 256 MB

  Storage: 100 MB → 1 GB

  Note: Storage grows with the number and size of messages kept (500 by default)
releaseNotes: >-
  Chore


  - Resolve the latest message ID in a single helper

  - Update Go dependencies

  - Update node dependencies


  Fix


  - Parse address headers with non-UTF-8 display names

  - Append missing recipients to an existing Bcc header

  - Keep address parsing strict when decoding non-UTF-8 display names

  - Guard against an empty Sender address list when releasing a message

  - Reject messages that cannot be parsed instead of discarding them silently

  - Return 400 for an invalid DELETE /api/v1/messages body

  - Decode RFC 2231 attachment file names in non-UTF-8 charsets

  - Accept latest as the ID in the release and thumbnail endpoints

  - Limit the number & total size of remote stylesheets fetched by HTML check (Kiseob Hong @Minerv4)


  Test


  - Enhance thumbnail tests for latest ID handling and add empty case


  Full release notes: https://github.com/axllent/mailpit/releases/tag/v1.33.1

