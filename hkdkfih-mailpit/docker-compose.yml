version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-mailpit_server_1
      APP_PORT: 8025

  server:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      MP_DATABASE: /data/mailpit.db
      # The SMTP port is reachable from the whole network, so senders must log in. Mailpit has
      # no TLS certificate here; plain-text AUTH is allowed for LAN/test use.
      MP_SMTP_AUTH: "umbrel:${APP_PASSWORD}"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "21604:1025" # SMTP for the apps and scripts whose mail you want to catch
    volumes:
      - ${APP_DATA_DIR}/data/mailpit:/data
