version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-cloudbeaver_server_1
      APP_PORT: 8978

  server:
    image: dbeaver/cloudbeaver:26.2.0@sha256:c06c1859700bd9202d9d49ebc10ee2512d745997d05e7ca6423267b227af1ca7
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/workspace:/opt/cloudbeaver/workspace
