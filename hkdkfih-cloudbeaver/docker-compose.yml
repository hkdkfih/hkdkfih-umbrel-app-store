version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-cloudbeaver_server_1
      APP_PORT: 8978

  server:
    image: dbeaver/cloudbeaver:26.2.5.1@sha256:405c02ef10efa0e0e410ba69f214d65f181fc3708da3d8197052634bed8ee0e7
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/workspace:/opt/cloudbeaver/workspace
