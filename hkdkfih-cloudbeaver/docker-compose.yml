version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-cloudbeaver_server_1
      APP_PORT: 8978

  server:
    image: dbeaver/cloudbeaver:26.2.5.2@sha256:ca5b72170e4247aaa60984d59efe4e979cb29c7ebfd351694fd56aaa1ad03d60
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/workspace:/opt/cloudbeaver/workspace
