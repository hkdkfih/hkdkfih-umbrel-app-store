version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-cloudbeaver_server_1
      APP_PORT: 8978

  server:
    image: dbeaver/cloudbeaver:26.2.5@sha256:5de1c6aa18da9e369966f88a1b25fe017b70ce3fdac7d879616aa931e44b013f
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/workspace:/opt/cloudbeaver/workspace
