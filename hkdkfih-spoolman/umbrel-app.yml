manifestVersion: 1
id: hkdkfih-spoolman
storage:
  dataRoot: data
category: automation
name: Spoolman
version: "0.27.1"
tagline: Keep track of your 3D printer filament spools
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-spoolman/icon.png
description: >-
  Spoolman has no accounts: open it and start adding your vendors, filaments and spools. To connect a Klipper
  printer, add a [spoolman] section with server: http://umbrel.local:21400 to Moonraker's configuration; OctoPrint
  and Home Assistant plugins use the same address.


  Spoolman is a self-hosted inventory for your 3D printing filament. It knows every spool you own, how much
  filament is left on each one and where it is stored, and your printers update it automatically as they print.


  - Track vendors, filament types and individual spools, with remaining weight and length

  - Live usage updates from Moonraker, so Fluidd, Mainsail and KlipperScreen show the active spool

  - Integrations for OctoPrint, OctoEverywhere and Home Assistant

  - Import filaments from the community SpoolmanDB database

  - Search, group and filter by vendor, material, colour or location

  - Design and print QR code labels for your spools

  - Custom fields, a dashboard by storage location and a REST API


  Security note: the Spoolman REST API (/api/v1) is reachable without the Umbrel login so that printers can
  report usage, and Spoolman itself has no login. Anyone on your network can read and change the inventory
  through it; the web interface stays protected by your Umbrel login.


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 256 MB → 512 MB

  Storage: 500 MB → 1 GB
releaseNotes: >-
  - Many fixes and some new features!

  - If your standalone install refused to start after updating to v0.27.0, this fixes it. It was being installed on Python 3.15, which one of our dependencies doesn't support yet, and updating moves it back to Python 3.14.

  - A spool tare of 0 is now kept as 0 instead of falling back to the filament or manufacturer's empty spool weight. If you have spools with a tare of 0 that relied on that fallback, check their remaining weight after updating.

  - Added filament and manufacturer lists, this was highly requested in the new client, hope it fits the needs!

  - OpenPrintTag tags can now be decoded. /tag/scan with format openprinttag returns what's on the tag, and can create the manufacturer, filament and spool for a tag it doesn't know yet (#1112, with help from @Ricky1966).

  - The QR scanner lets you pick which camera to use .

  - …


  Full release notes: https://github.com/Donkie/Spoolman/releases/tag/v0.27.1

