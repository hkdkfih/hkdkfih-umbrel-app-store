version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-wekan_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/wekan/wekan:v12.50@sha256:564c16b6c052c473a3a11c23c80235b130c46befa6171ae9b6b52a0bb55f0d06
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # Upstream's default backend: the FerretDB v1 binary bundled in the image, storing
      # everything in SQLite under WRITABLE_PATH. Unlike MongoDB 5+, it needs no AVX or
      # ARMv8.2 CPU, so it also runs on Umbrel Home and Raspberry Pi 4.
      WEKAN_DB: ferretdb
      WRITABLE_PATH: /data
      # Used for links in e-mails and attachment URLs. The UI itself works on any hostname.
      ROOT_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      WITH_API: "true"
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
