tagline: Open source kanban boards for teams
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-wekan/icon.png
description: >-
  On first launch, click "Register" and create your account: the first registered user becomes the
  administrator. Afterwards you can turn off self-registration in Admin Panel → Settings → Registration and
  invite other people instead.


  WeKan is an open source kanban board inspired by Trello. Organise tasks into boards, swimlanes, lists and
  cards, and collaborate with your team in real time.


  - Boards with swimlanes, lists, cards, labels, checklists and due dates

  - Calendar, table, Gantt and many more board views

  - Card attachments, comments, custom fields, voting and time tracking

  - Rules and automations triggered by board activity

  - Import from Trello, Jira, CSV and other WeKan instances, and export to CSV and JSON

  - Translated into dozens of languages


  WeKan stores its data in an embedded SQLite database (through FerretDB, upstream's default backend), so it
  needs no separate database server.


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 10 GB

  Note: Storage grows with card attachments
releaseNotes: >-
  In short


  - the Docker image's vulnerability scans on Quay and Artifact

  - Hub are cut down to what has no fix yet. The image no longer carries

  - docker-cli and its old Go, the bundled FerretDB and MongoDB tools

  - are built with Go 1.27.2, and eight npm packages inside Meteor's own

  - packages are raised to fixed releases. The Android and FreeBSD Bun

  - builds are fixed, the Docker job checks the bundle version again, and SAML

  - logs in users whose binding lacks the optional qualifiers.

  - Thanks to above GitHub users for their contributions.

  - More details at ChangeLog


  Full release notes: https://github.com/wekan/wekan/releases/tag/v12.39

