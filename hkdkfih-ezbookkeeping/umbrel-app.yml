manifestVersion: 1
id: hkdkfih-ezbookkeeping
storage:
  dataRoot: data
category: finance
name: ezBookkeeping
version: "2.1.0"
tagline: A lightweight personal bookkeeping app
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-ezbookkeeping/icon.png
description: >-
  On first launch, click "Sign up" to create your account.


  ezBookkeeping is a lightweight, self-hosted personal finance app with a friendly interface for both desktop
  and mobile. Track income and expenses across all your accounts and see where your money goes.


  - Multiple accounts and currencies with automatic exchange rates

  - Categories, tags, transaction pictures and locations on a map

  - Rich statistics and trend analysis

  - Import from CSV, OFX, QIF, Excel and other apps' exports

  - Two-factor authentication and app lock

  - Installable as a mobile web app (PWA)


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 128 MB → 512 MB

  Storage: 200 MB → 2 GB
releaseNotes: >-
  - [Breaking]

  - Rename the configuration section llm to ai

  - The daily total amounts on the Transaction Calendar widget are displayed as total inflows and total outflows by default

  - Not roll back the entire import if some transactions fail to be created during import

  - [Features]

  - Add Polish translation (#698, #699, #718, thanks @mnowok)

  - Support AI generated custom charts in Insights Explorer

  - Add Account Unreconciled Transactions widget

  - Add National Bank of Belarus, Bank of Italy and Central Bank of Malaysia exchange rates data source

  - The monthly and daily total amounts on the Transaction List page can be set to total inflows and total outflows, or total income and total expenses

  - The daily total amounts on the Transaction Calendar widget can be set to total inflows and total outflows, or total income and total expenses

  - …


  Full release notes: https://github.com/mayswind/ezbookkeeping/releases/tag/v2.1.0

