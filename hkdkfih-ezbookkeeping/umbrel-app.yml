manifestVersion: 1
id: hkdkfih-ezbookkeeping
storage:
  dataRoot: data
category: finance
name: ezBookkeeping
version: "2.2.0"
tagline: A lightweight personal bookkeeping app
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-ezbookkeeping/icon.png
description: >-
  On first launch, click "Sign up" to create your account.


  ezBookkeeping is a lightweight, self-hosted personal finance app with a friendly interface for both desktop
  and mobile. Track income and expenses across all your accounts and see where your money goes.


  - Multiple accounts and currencies with automatic exchange rates

  - Categories, tags, transaction pictures and locations on a map

  - Rich statistics and trend analysis

  - Import from CSV, OFX, QIF, Excel and other apps' exports

  - Two-factor authentication and app lock

  - Installable as a mobile web app (PWA)


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 128 MB → 512 MB

  Storage: 200 MB → 2 GB
releaseNotes: >-
  - [Breaking]

  - Use the new token format (support for the legacy token format will be removed in v2.3.0)

  - Clear all session tokens by default when disabling a user

  - Clear all session tokens when deleting a user

  - Disable automatic login after email verification

  - Delete temporary tokens before performing verification during password recovery and OAuth 2.0 authentication

  - Change the default value of forget_password_require_email_verify to true

  - Load language resources asynchronously

  - [Features]

  - Add Hindi translation (#746, #747, thanks @rahul05ranjan)

  - Add Slovak translation (#753, thanks @Laybr1990)

  - Support adding multiple transactions at once on desktop version

  - Add user custom import presets

  - Support filtering scheduled transactions by status and displaying them in a calendar view

  - Support selecting which MCP tools are enabled for an MCP token

  - …


  Full release notes: https://github.com/mayswind/ezbookkeeping/releases/tag/v2.2.0

