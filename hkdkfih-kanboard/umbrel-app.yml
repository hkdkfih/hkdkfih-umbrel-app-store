name: Kanboard
version: "1.2.55"
tagline: Project management focused on the Kanban methodology
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-kanboard/icon.png
description: >-
  Log in with the username and password shown by Umbrel. You can change the password and add more users in
  Kanboard's user management.


  Kanboard is a free and open source Kanban project management tool. It keeps things simple: a clear board to
  visualize your work, limits on work in progress to stay focused, and just enough features to manage projects
  for yourself or a small team.


  - Boards with columns, swimlanes, colors, tags and WIP limits

  - Calendar, list and Gantt views

  - Subtasks, time tracking, attachments and comments

  - Automatic actions to move, assign or close tasks for you

  - Analytics such as cumulative flow and burndown charts

  - RSS and iCal feeds, a JSON-RPC API and many plugins


  The JSON-RPC API and the RSS/iCal feeds are reachable without the Umbrel login so apps and calendars can
  use them; they are protected by Kanboard's own credentials and secret tokens.


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 512 MB → 1 GB

  Storage: 1 GB → 5 GB

  Note: Storage grows with task attachments
releaseNotes: >-
  Security fixes


  - Prevent spoofed client IP addresses in trusted-proxy headers from bypassing IP-based CAPTCHA and login lockouts

  - Restrict dashboard and overdue-task queries to projects a user can still access

  - Enforce project authorization when closing board columns, reordering subtasks, and duplicating tasks between projects

  - Require the project-manager role to modify project metadata through the API

  - Validate and escape color IDs and project names to prevent cross-site scripting

  - Limit iCalendar start-date fields to supported task columns


  Improvements


  - Add support for uploading and previewing WebP image attachments

  - Allow API clients to set a validated project member as the creator of task and project attachments

  - Add Azerbaijani interface translations and improve Swedish translations


  Bug fixes


  - Preserve session cookies when Kanboard is installed in a subdirectory

  - …


  Full release notes: https://github.com/kanboard/kanboard/releases/tag/v1.2.55

