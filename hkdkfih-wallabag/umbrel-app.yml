manifestVersion: 1
id: hkdkfih-wallabag
storage:
  dataRoot: data
category: files
name: wallabag
version: "2.6.15"
tagline: Save and classify articles, read them later
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-wallabag/icon.png
description: >-
  Log in with the username and password shown by Umbrel. The first start takes a minute while wallabag sets
  up its database. You can change the password and add more users in wallabag's settings.


  wallabag is a self-hosted read-it-later app. Save web articles with one click, and wallabag extracts the
  content so you can read it later in a clean, distraction-free view, on any device, even offline.


  - Clean reading view with estimated reading time, annotations and highlights

  - Tags, tagging rules, starring, archiving and powerful filters

  - Browser extensions for Firefox and Chrome, a bookmarklet and apps for Android and iOS

  - Import from Pocket, Instapaper, Pinboard, Omnivore, browser bookmarks and more

  - Export articles to EPUB, PDF, MOBI, CSV, JSON and more

  - Per-user RSS feeds and a REST API


  To connect the mobile apps or the browser extension, create a client in wallabag under "API clients
  management" and use your Umbrel address with this app's port as the server URL. The API and RSS paths are
  reachable without the Umbrel login and are protected by wallabag's own credentials and tokens.


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 512 MB → 1 GB

  Storage: 1 GB → 5 GB

  Note: Storage grows with saved articles and downloaded images
releaseNotes: >-
  - Support PHP 8.4 while retaining compatibility with PHP 7.4 and the locked legacy dependencies. Deprecation notices may still be emitted.

  - Read the blog post about that release.

  - Backport documentation monorepo merge to 2.6

  - Introduce a REDIS_URL (backport)

  - Hide delete public link item if not necessary

  - Update graby and php-readability dependencies

  - Backport #8020 Fix volatile tests to 2.6

  - Backport #8585 Prefetch content ISO to fetch URL content to 2.6

  - Backport to 2.6: Bump phpseclib/phpseclib to 3.0.55

  - Escape dynamic data in the ePub export

  - Fix content and fetchedContent merging

  - Backport translations from master

  - Prepare 2.6.15 release


  Full release notes: https://github.com/wallabag/wallabag/releases/tag/2.6.15

