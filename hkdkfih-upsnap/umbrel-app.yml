  - https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-upsnap/3.jpg
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: hkdkfih
submission: https://github.com/hkdkfih/hkdkfih-umbrel-app-store
