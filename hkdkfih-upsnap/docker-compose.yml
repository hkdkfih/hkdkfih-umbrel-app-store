version: "3.7"

services:
  server:
    image: ghcr.io/seriousm4x/upsnap:5.7.3@sha256:e01e61ac6bfbf34a2003364e1499faf2da0fba0a485e0f4b31c49b6576b95e9d
    user: "1000:1000"
    # Host networking is required: Wake-on-LAN magic packets are broadcasts to the local network,
    # and device discovery (nmap) and ping must reach LAN hosts directly, which a Docker bridge
    # network prevents. The web UI listens on the manifest port below.
    network_mode: host
    # As in upstream's compose: only NET_RAW, which the binary raises for privileged ping and
    # network scans.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    restart: on-failure
    stop_grace_period: 1m
    environment:
      UPSNAP_HTTP_LISTEN: 0.0.0.0:21204
    volumes:
      - ${APP_DATA_DIR}/data/upsnap:/app/pb_data
