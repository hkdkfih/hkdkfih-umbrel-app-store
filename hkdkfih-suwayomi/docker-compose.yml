version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-suwayomi_server_1
      APP_PORT: 4567

  server:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2373@sha256:7e25953e143c890417d1e69426281c6e8e470cca208b1cbdca684e8236c2bb13
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    # Server settings passed as environment variables would override the web UI on every
    # start, so everything else (including Suwayomi's own login) is left to the web UI.
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/suwayomi:/home/suwayomi/.local/share/Tachidesk
