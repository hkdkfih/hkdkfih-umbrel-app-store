version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-suwayomi_server_1
      APP_PORT: 4567

  server:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366@sha256:1fac27c387dc2ea9949e1a01ad7f6d6de9d72d3988338a95476748e5c45c4582
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    # Server settings passed as environment variables would override the web UI on every
    # start, so everything else (including Suwayomi's own login) is left to the web UI.
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/suwayomi:/home/suwayomi/.local/share/Tachidesk
