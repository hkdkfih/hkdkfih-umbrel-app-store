version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-glance_server_1
      APP_PORT: 8080

  server:
    image: glanceapp/glance:v0.8.8@sha256:4d7445bc7971836858ffddee5d7501f1efbabb6e694a45b1dde1a789bb1943bb
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    # The image's entrypoint reads /app/config/glance.yml from this mounted directory; the package
    # ships a default glance.yml there on install, and later edits are kept across updates.
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
