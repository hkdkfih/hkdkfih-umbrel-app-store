tagline: Real-time monitoring for Proxmox, Docker and more
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-pulse/icon.png
description: >-
  On first launch, Pulse asks for a one-time setup token. Find it in the app's logs in umbrelOS (right-click the app → Troubleshoot), then set your admin password and add your Proxmox servers.


  Pulse is a fast, good-looking dashboard for Proxmox VE, Proxmox Backup Server and Docker hosts. See every node, VM, container and backup at a glance and get alerted when something goes wrong.


  - Live CPU, memory, disk and network for nodes, VMs and containers

  - Backup and snapshot overview

  - Alerts by email, Discord, ntfy, Gotify, webhooks and more

  - Read-only API tokens; nothing to install on your Proxmox hosts


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 128 MB → 512 MB

  Storage: 200 MB → 1 GB

  Note: Needs Proxmox, PBS or Docker hosts to monitor
