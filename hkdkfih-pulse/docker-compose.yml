version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-pulse_server_1
      APP_PORT: 7655

  server:
    image: rcourtman/pulse:6.9.0@sha256:837e91b8e4310529cae15effa0cab5a3644c966c536237d04fe8cf4c160c2bdb
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/pulse:/data
