version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-pulse_server_1
      APP_PORT: 7655

  server:
    image: rcourtman/pulse:6.8.0@sha256:fbce664418743af311ffe2abec65c51d13902533b08f19928333e1c4afe6176a
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/pulse:/data
