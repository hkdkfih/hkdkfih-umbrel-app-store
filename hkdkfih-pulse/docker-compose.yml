version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-pulse_server_1
      APP_PORT: 7655

  server:
    image: rcourtman/pulse:6.7.0@sha256:24c0de041ca6c81df110a9880a9121000ed2e83ea2a67a652ab4f1922597d5f3
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/pulse:/data
