version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-pulse_server_1
      APP_PORT: 7655

  server:
    image: rcourtman/pulse:6.6.0@sha256:b47b3fba6ce131a66c23f9a6b2f7b5beef9b6f40d463b362ba4d3833b45071cc
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/pulse:/data
