storage:
  dataRoot: data
category: automation
name: OliveTin
version: "3000.22.0"
tagline: Safe, simple buttons for your shell commands
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-olivetin/icon.png
description: >-
  Edit config.yaml in the app's data folder (Files → Apps) to add your own actions. Commands run inside the OliveTin container, not on your Umbrel itself.


  OliveTin gives you a clean web interface with buttons that run predefined shell commands, so you (or your family) can trigger scripts without a terminal.


  - Define actions with arguments, dropdowns and confirmations

  - Run actions on a schedule, on startup or from webhooks

  - See output and history of every run

  - Dashboards, themes and access control


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 64 MB → 256 MB

  Storage: 100 MB → 500 MB
releaseNotes: >-
  Security


  - security: GHSA-fxmj-cjvj-x372 (HIGH) separate oauth state from session

  - security: GHSA-fxmj-cjvj-x372 harden oauth session issuance

  - security: GHSA-gp3q-q8qg-j4xf (HIGH) keep JWKS refresh alive


  Features


  - feat(api): deprecate StartActionByGet* and warn on Diagnostics when called

  - feat(api): mark StartActionByGet and StartActionByGetAndWait as deprecated

  - feat(api): warn on Diagnostics when deprecated StartActionByGet* is called

  - feat(docker): add healthcheck


  Bug fixes


  - fix(api): demote EventStream disconnect log to debug

  - fix(auth): address oauth review findings

  - fix(auth): hide nav when login required

  - fix(deps): align engines.node with stylelint 18's supported Node range

  - fix(deps): update picocrank to 1.40.0

  - fix(deps): update picocrank to 1.41.0 and move banners into AppShell

  - fix(webhooks): log match and no-match outcomes

  - …


  Full release notes: https://github.com/OliveTin/OliveTin/releases/tag/3000.22.0

