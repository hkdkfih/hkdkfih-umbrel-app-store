version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-backrest_server_1
      APP_PORT: 9898

  server:
    image: garethgeorge/backrest:v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
    # container runs as root so restic can read every file selected for backup
    # a fixed hostname keeps snapshot metadata stable across container recreation
    hostname: backrest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/cache:/cache
      - ${APP_DATA_DIR}/data/rclone:/root/.config/rclone
