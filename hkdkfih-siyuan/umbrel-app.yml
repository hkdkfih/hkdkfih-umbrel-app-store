manifestVersion: 1
id: hkdkfih-siyuan
storage:
  dataRoot: data
environment:
  - name: TZ
    services:
      - server
    default: Etc/UTC
    note: IANA time zone used for daily notes and timestamps, such as Europe/London or America/New_York.
category: files
name: SiYuan
version: "3.8.8"
tagline: A privacy-first, self-hosted personal knowledge base
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-siyuan/icon.png
description: >-
  On first launch, unlock SiYuan with the access code shown by Umbrel as the password.


  SiYuan is a privacy-first personal knowledge management system with fine-grained block-level references and
  Markdown WYSIWYG editing. Write notes, link ideas together and build your own knowledge graph, all stored on
  your Umbrel.


  - Block-level references and embeds, bidirectional links and a graph view

  - WYSIWYG Markdown editor with tables, math, diagrams and code blocks

  - Databases (attribute views) with tables, filters and sorting

  - Flashcards with spaced repetition

  - Templates, daily notes, tags and powerful search with SQL queries

  - Snapshots and history to restore earlier versions of your notes


  The Docker version runs in the browser only; exporting to PDF, HTML and Word and importing Markdown are not
  available.


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 512 MB → 2 GB

  Storage: 1 GB → 10 GB
releaseNotes: >-
  Overview


  - This release expands database automations, introduces a compact desktop interface, and improves mobile editing, mind maps, AI integrations, and Linux compatibility.


  Databases and editing


  - Database automations can collect blocks and assign field values using templates. Locked views support temporary sorting, and database attribute panels adopt a single-column layout. Block reference input, outline navigation, callout conversion, and PDF page breaks are also improved.


  Desktop, mobile, and mind maps


  - The desktop interface gains a compact mode, menus support scrolling with mouse movement, and mind maps offer multiple connector styles and improved layout density. Mobile database panels, table features, and long-press block dragging are improved. iOS Live Photos can be imported, with metadata display and playback available across platforms.

  - …


  Full release notes: https://github.com/siyuan-note/siyuan/releases/tag/v3.8.8

developer: SiYuan
website: https://b3log.org/siyuan/en/
