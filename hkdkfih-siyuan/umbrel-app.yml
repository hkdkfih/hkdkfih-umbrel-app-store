manifestVersion: 1
id: hkdkfih-siyuan
storage:
  dataRoot: data
environment:
  - name: TZ
    services:
      - server
    default: Etc/UTC
    note: IANA time zone used for daily notes and timestamps, such as Europe/London or America/New_York.
category: files
name: SiYuan
version: "3.8.10"
tagline: A privacy-first, self-hosted personal knowledge base
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-siyuan/icon.png
description: >-
  On first launch, unlock SiYuan with the access code shown by Umbrel as the password.


  SiYuan is a privacy-first personal knowledge management system with fine-grained block-level references and
  Markdown WYSIWYG editing. Write notes, link ideas together and build your own knowledge graph, all stored on
  your Umbrel.


  - Block-level references and embeds, bidirectional links and a graph view

  - WYSIWYG Markdown editor with tables, math, diagrams and code blocks

  - Databases (attribute views) with tables, filters and sorting

  - Flashcards with spaced repetition

  - Templates, daily notes, tags and powerful search with SQL queries

  - Snapshots and history to restore earlier versions of your notes


  The Docker version runs in the browser only; exporting to PDF, HTML and Word and importing Markdown are not
  available.


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 512 MB → 2 GB

  Storage: 1 GB → 10 GB
releaseNotes: >-
  Overview


  - This release adds rich document titles, database sub-items and related views, workspace-level AI long-term memory, and a built-in lightweight Markdown editor.

  - Document trees handle large directories more efficiently, while unified document and block breadcrumbs make navigation more consistent. Other improvements include mobile bottom sheets, HTTP requests in templates, custom PDF page sizes, LAN sync address selection, and bazaar compatibility filtering.


  Changelogs


  - Below are the detailed changes in this version.


  Enhancement


  - Support unified document and block breadcrumbs

  - Support rich document titles and preserve slashes in notebook names

  - Improve document tree browsing performance and access to large directories

  - Support breadcrumb button visibility and ordering in appearance profiles

  - Support converting embed blocks to regular blocks or block references

  - …


  Full release notes: https://github.com/siyuan-note/siyuan/releases/tag/v3.8.10

developer: SiYuan
website: https://b3log.org/siyuan/en/
dependencies: []
repo: https://github.com/siyuan-note/siyuan
support: https://github.com/siyuan-note/siyuan/issues

port: 6806
