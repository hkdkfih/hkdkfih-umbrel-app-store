manifestVersion: 1
id: hkdkfih-siyuan
storage:
  dataRoot: data
environment:
  - name: TZ
    services:
      - server
    default: Etc/UTC
    note: IANA time zone used for daily notes and timestamps, such as Europe/London or America/New_York.
category: files
name: SiYuan
version: "3.8.12"
tagline: A privacy-first, self-hosted personal knowledge base
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-siyuan/icon.png
description: >-
  On first launch, unlock SiYuan with the access code shown by Umbrel as the password.


  SiYuan is a privacy-first personal knowledge management system with fine-grained block-level references and
  Markdown WYSIWYG editing. Write notes, link ideas together and build your own knowledge graph, all stored on
  your Umbrel.


  - Block-level references and embeds, bidirectional links and a graph view

  - WYSIWYG Markdown editor with tables, math, diagrams and code blocks

  - Databases (attribute views) with tables, filters and sorting

  - Flashcards with spaced repetition

  - Templates, daily notes, tags and powerful search with SQL queries

  - Snapshots and history to restore earlier versions of your notes


  The Docker version runs in the browser only; exporting to PDF, HTML and Word and importing Markdown are not
  available.


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 512 MB → 2 GB

  Storage: 1 GB → 10 GB
releaseNotes: >-
  Upgrade notice


  - Plugins that rely on the desktop main menu’s previous identifier, barWorkspace, should use barMainMenu for the button ID and menu events. Details


  Overview


  - This release adds manual ordering for sibling tags and sorting by most recent addition in the tag panel. Mobile image preview gestures and controls are improved, and asset files can now be shared from mobile.

  - The desktop Markdown editor supports relative document links, and database cell editors are better aligned. This release also adds a Vietnamese interface and a built-in Russian user guide, and introduces the official SiYuan connector for WorkBuddy.

  - Watch the release overview: YouTube


  Changelogs


  - Below are the detailed changes in this version.


  Enhancement


  - Support manual sorting of sibling tags in the tag panel

  - Support sorting the tag panel by most recent addition

  - …


  Full release notes: https://github.com/siyuan-note/siyuan/releases/tag/v3.8.12

developer: SiYuan
