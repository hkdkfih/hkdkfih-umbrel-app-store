version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-siyuan_server_1
      APP_PORT: 6806

  server:
    image: b3log/siyuan:v3.8.7@sha256:aced5ce847dc0a6bd33033176533e7c0954a0f043c95806f6831b7a351a952c9
    # entrypoint starts as root, chowns the workspace to PUID/PGID and drops privileges
    restart: on-failure
    stop_grace_period: 1m
    command:
      - serve
      - --workspace=/siyuan/workspace/
      - --accessAuthCode=${APP_PASSWORD}
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/workspace:/siyuan/workspace
      - ${APP_DATA_DIR}/data/config:/home/siyuan/.config/siyuan
