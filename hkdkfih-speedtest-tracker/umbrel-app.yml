manifestVersion: 1
id: hkdkfih-speedtest-tracker
storage:
  dataRoot: data
environment:
  - name: SPEEDTEST_SCHEDULE
    services:
      - server
    note: Cron expression for automatic tests, for example "0 */2 * * *" for every two hours.
category: networking
name: Speedtest Tracker
version: "1.15.0"
tagline: Keep an eye on your internet speed
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-speedtest-tracker/icon.png
description: >-
  Log in with the email and password shown by Umbrel. Set how often tests run with the SPEEDTEST_SCHEDULE setting in the app's settings in umbrelOS (a cron expression), or start a test from the dashboard.


  Speedtest Tracker runs Ookla speed tests on a schedule and keeps the history, so you can see whether your internet provider delivers what you pay for.


  - Download, upload, ping and jitter over time

  - Thresholds that flag slow results

  - Notifications by email, Discord, Telegram, ntfy, webhooks and more

  - Choose specific test servers and export your results


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 256 MB → 512 MB

  Storage: 500 MB → 2 GB

  Note: Each test uses your full bandwidth for a few seconds
releaseNotes: ""

developer: Alex Justesen
website: https://docs.speedtest-tracker.dev/
dependencies: []
repo: https://github.com/alexjustesen/speedtest-tracker
support: https://github.com/alexjustesen/speedtest-tracker/issues

port: 22003
gallery:
  - https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-speedtest-tracker/1.jpg
  - https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-speedtest-tracker/2.jpg
path: ""

defaultUsername: "umbrel@umbrel.local"
deterministicPassword: true

submitter: hkdkfih
submission: https://github.com/hkdkfih/hkdkfih-umbrel-app-store
