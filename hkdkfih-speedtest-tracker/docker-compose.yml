version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-speedtest-tracker_server_1
      APP_PORT: 80

  server:
    image: ghcr.io/linuxserver/speedtest-tracker:1.15.0@sha256:1eeed2307699c083407bd4c1eb86f14d5179f9e1cd960f57d4cbab6f1f8b8a42
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: 1000
      PGID: 1000
      APP_KEY: ${APP_HKDKFIH_SPEEDTEST_TRACKER_APP_KEY}
      APP_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      DB_CONNECTION: sqlite
      ADMIN_NAME: Umbrel
      ADMIN_EMAIL: umbrel@umbrel.local
      ADMIN_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
