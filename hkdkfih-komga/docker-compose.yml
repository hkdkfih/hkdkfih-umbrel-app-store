version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-komga_server_1
      APP_PORT: 25600
      # OPDS readers and Kobo/KOReader sync can't send Umbrel login cookies; Komga
      # authenticates them with its own credentials or API keys.
      PROXY_AUTH_WHITELIST: "/opds/*,/kobo/*,/koreader/*"

  server:
    image: gotson/komga:1.30.2@sha256:e4198a0d529d2be70bee5012484538154897c2d3071043b133bdaeacb806444e
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
