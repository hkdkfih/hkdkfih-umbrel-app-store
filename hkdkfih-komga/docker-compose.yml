version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-komga_server_1
      APP_PORT: 25600
      # OPDS readers and Kobo/KOReader sync can't send Umbrel login cookies; Komga
      # authenticates them with its own credentials or API keys.
      PROXY_AUTH_WHITELIST: "/opds/*,/kobo/*,/koreader/*"

  server:
    image: gotson/komga:1.30.1@sha256:d43bb3b57aeeafd274ea805214f5da71ff9306accf012fb14cc13dedc3307212
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
