version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-komga_server_1
      APP_PORT: 25600
      # OPDS readers and Kobo/KOReader sync can't send Umbrel login cookies; Komga
      # authenticates them with its own credentials or API keys.
      PROXY_AUTH_WHITELIST: "/opds/*,/kobo/*,/koreader/*"

  server:
    image: gotson/komga:1.29.2@sha256:1d89b79f6cee732438c0c51f876373ad1c6a0d6cdae47c008bfa24e1d1bed748
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
