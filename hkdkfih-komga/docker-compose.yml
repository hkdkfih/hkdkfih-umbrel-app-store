version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-komga_server_1
      APP_PORT: 25600
      # OPDS readers and Kobo/KOReader sync can't send Umbrel login cookies; Komga
      # authenticates them with its own credentials or API keys.
      PROXY_AUTH_WHITELIST: "/opds/*,/kobo/*,/koreader/*"

  server:
    image: gotson/komga:1.29.0@sha256:c9ad2e0a0efdbb60a79b990836bd2b3d48b1f47677d2e5008579daa10a85e8e8
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
