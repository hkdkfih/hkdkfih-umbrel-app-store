manifestVersion: 1
id: hkdkfih-silverbullet
storage:
  dataRoot: data
category: files
name: SilverBullet
version: "2.12.0"
tagline: Programmable, private, personal knowledge in Markdown
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-silverbullet/icon.png
description: >-
  On first launch, the setup wizard asks you to create an admin account and your first space.


  SilverBullet is a note-taking app for people who like to tinker. Your notes are plain Markdown files, and
  every page can be turned into a little application with live queries, templates, widgets and Space Lua
  scripting.


  - Fast, keyboard-driven Markdown editor with live preview

  - Links, backlinks, tags, tasks and a page index

  - Live queries that turn your notes into dashboards, task lists and tables

  - Extend and customise everything with Space Lua and plugs

  - Multiple spaces and users from one installation


  Over plain http, SilverBullet works online-only. Open it over https to enable offline mode.
