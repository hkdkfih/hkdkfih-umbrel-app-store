category: files
name: SilverBullet
version: "2.12.1"
tagline: Programmable, private, personal knowledge in Markdown
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-silverbullet/icon.png
description: >-
  On first launch, the setup wizard asks you to create an admin account and your first space.


  SilverBullet is a note-taking app for people who like to tinker. Your notes are plain Markdown files, and
  every page can be turned into a little application with live queries, templates, widgets and Space Lua
  scripting.


  - Fast, keyboard-driven Markdown editor with live preview

  - Links, backlinks, tags, tasks and a page index

  - Live queries that turn your notes into dashboards, task lists and tables

  - Extend and customise everything with Space Lua and plugs

  - Multiple spaces and users from one installation


  Over plain http, SilverBullet works online-only. Open it over https to enable offline mode.


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 256 MB → 1 GB

  Storage: 200 MB → 2 GB
releaseNotes: >-
  - Security: the filesystem API refuses access to dot-prefixed files and directories, consistent with space listings.

  - Fix: HTTP file validators respect If-None-Match precedence, and file reads and conditional writes tolerate proxies that weaken or transform ETags.

  - Fix: YAML data blocks split only on standalone --- lines; X-Ray includes attributes added during indexing.

  - Fix: system.reboot() preserves external edits and clears cached widgets. Reopening a page restores a remembered scroll position of zero.

  - Fix: the [[Runtime API]] returns JSON for query rows, null values, dates and other Lua values without serialization crashes, and remains usable after the client reloads its UI.

  - SLIQ errors offer more specific explanations for common mistakes.

  - …


  Full release notes: https://github.com/silverbulletmd/silverbullet/releases/tag/2.12.1

