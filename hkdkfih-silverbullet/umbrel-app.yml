category: files
name: SilverBullet
version: "3.0.1"
tagline: Programmable, private, personal knowledge in Markdown
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-silverbullet/icon.png
description: >-
  On first launch, the setup wizard asks you to create an admin account and your first space.


  SilverBullet is a note-taking app for people who like to tinker. Your notes are plain Markdown files, and
  every page can be turned into a little application with live queries, templates, widgets and Space Lua
  scripting.


  - Fast, keyboard-driven Markdown editor with live preview

  - Links, backlinks, tags, tasks and a page index

  - Live queries that turn your notes into dashboards, task lists and tables

  - Extend and customise everything with Space Lua and plugs

  - Multiple spaces and users from one installation


  Over plain http, SilverBullet works online-only. Open it over https to enable offline mode.


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 256 MB → 1 GB

  Storage: 200 MB → 2 GB
releaseNotes: >-
  - Fix: plugs (.plug.js files) now only load from Library/, following the whole "Space Lua and Style Lives in Library", move them under Library/. This should have been the case before, but wasn't implemented.

  - .plug.js and .js.map files are now listed as regular documents: they show up in the Library segment of the document picker and Space Tree.

  - Workbench > Data: *Create page template* in a tag's Schema view turns its schema into a Page Template, so new pages start with the tag and its attributes.

  - Fix: choosing *enum* as an attribute type in the [[Workbench/Data]] Schema view no longer errors and falls back to string. A new enum starts from the values already in use, and its allowed values save when you leave the field or press Enter.

  - …


  Full release notes: https://github.com/silverbulletmd/silverbullet/releases/tag/3.0.1

