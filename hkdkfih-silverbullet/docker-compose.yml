version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-silverbullet_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/silverbulletmd/silverbullet:2.12.1-slim@sha256:7e24c16d31a3f4b4a4832ed64ec585e605a1e275b7c35917d385176f0b40415c
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/silverbullet:/data
