version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-silverbullet_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/silverbulletmd/silverbullet:3.0.1-slim@sha256:111e1501cbe7b9c362b14c9ffb3ea1e8d5c32924dc9d46a127b4d790336c3ad0
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/silverbullet:/data
