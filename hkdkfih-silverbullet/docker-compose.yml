version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-silverbullet_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/silverbulletmd/silverbullet:3.0.0-slim@sha256:c221f3017ee7f29f38299f046c2746d50b768f12473c6b720b495c96b79b2712
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/silverbullet:/data
