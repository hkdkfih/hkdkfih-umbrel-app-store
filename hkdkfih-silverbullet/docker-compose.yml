version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-silverbullet_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/silverbulletmd/silverbullet:2.12.0-slim@sha256:af31fc55b735658aed827fff7f75acca1fff97516d1ac11cca40011b3622d345
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/silverbullet:/data
