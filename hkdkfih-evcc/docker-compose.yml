version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-evcc_server_1
      APP_PORT: 7070

  server:
    image: evcc/evcc:0.320.0@sha256:71b4eacd8c1c859925d36c6b9400fa5cc93d33fb1da918dee1b72b53c1a3f8ad
    # container runs as root (upstream default)
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "18887:8887" # OCPP: lets OCPP wallboxes connect to evcc
    volumes:
      - ${APP_DATA_DIR}/data/evcc:/root/.evcc
