version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-evcc_server_1
      APP_PORT: 7070

  server:
    image: evcc/evcc:0.318.0@sha256:8823cce6a06dd254089ae8a7f00f0c720fdffba22881b5d09bfa0a7514978e18
    # container runs as root (upstream default)
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "18887:8887" # OCPP: lets OCPP wallboxes connect to evcc
    volumes:
      - ${APP_DATA_DIR}/data/evcc:/root/.evcc
