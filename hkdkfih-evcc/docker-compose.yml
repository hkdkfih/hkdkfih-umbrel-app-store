version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-evcc_server_1
      APP_PORT: 7070

  server:
    image: evcc/evcc:0.317.0@sha256:42bf170708f99f009767dcb0eb1f38c74bb35d5c635824ec90b87784ee20580b
    # container runs as root (upstream default)
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "18887:8887" # OCPP: lets OCPP wallboxes connect to evcc
    volumes:
      - ${APP_DATA_DIR}/data/evcc:/root/.evcc
