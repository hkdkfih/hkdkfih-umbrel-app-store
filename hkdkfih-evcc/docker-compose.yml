version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-evcc_server_1
      APP_PORT: 7070

  server:
    image: evcc/evcc:0.317.1@sha256:c50cd4f83c22b39722a76a76b8d428b69bf8ab3334209ed9ed24ec0e3c48dde5
    # container runs as root (upstream default)
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "18887:8887" # OCPP: lets OCPP wallboxes connect to evcc
    volumes:
      - ${APP_DATA_DIR}/data/evcc:/root/.evcc
