version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-evcc_server_1
      APP_PORT: 7070

  server:
    image: evcc/evcc:0.319.1@sha256:b4fb63cb90710a989d4f491bd81a6505326337a22a95e82c3227fd78ffd5116d
    # container runs as root (upstream default)
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "18887:8887" # OCPP: lets OCPP wallboxes connect to evcc
    volumes:
      - ${APP_DATA_DIR}/data/evcc:/root/.evcc
