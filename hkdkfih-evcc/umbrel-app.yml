manifestVersion: 1
id: hkdkfih-evcc
storage:
  dataRoot: data
environment:
  - name: TZ
    services:
      - server
    default: Europe/Berlin
    note: IANA time zone used for charging plans and dynamic tariffs, such as Europe/London or America/New_York.
category: automation
name: evcc
version: "0.318.0"
tagline: Solar charging for your electric vehicle
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-evcc/icon.png
description: >-
  On first launch, set an admin password and add your devices in the browser. Set your time zone in the app's
  settings in umbrelOS.


  evcc is an extensible EV charge controller and home energy management system. It charges your electric car
  with surplus solar power, uses cheap or green grid electricity when it matters, and shows the energy flow of
  your whole home in a clean, live dashboard.


  - Supports wallboxes, smart plugs, inverters, batteries, heat pumps and vehicles from hundreds of manufacturers

  - Charging modes: solar only, min + solar, and fast, plus departure-time charging plans

  - Dynamic tariffs and CO2-aware charging

  - Charging session history and statistics

  - Integrations with Home Assistant, MQTT and a REST API


  Devices are added by IP address. OCPP wallboxes connect to ws://umbrel.local:18887/<station-id>. Discovery and
  devices that need UDP broadcasts (such as SMA Home Manager) are not available, because the app does not use
  host networking.


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 256 MB → 512 MB

  Storage: 200 MB → 1 GB
releaseNotes: >-
  Breaking Changes 🚨


  - Battery limits: expose plugin errors

  - Home Assistant: fix battery direction help

  - SofarSolar G3: write max charge/discharge power for battery modes

  - mDNS: stable instance name per installation


  New Features 💫


  - Add A-Tronix AX Plus

  - Add CHINT DTSU666 meters

  - Add Frank Energie tariff

  - Add Grizzl-E Mini Connect charger

  - Add Tuya chargers

  - Bender: add vehicle SoC for Mennekes 4You/4Business

  - Config UI: add onboarding flow and setup checklist

  - Home Assistant charger: add temperature entity for heating devices

  - Kathrein: add watchdog

  - Messenger (ntfy): add schema option to allow http

  - MySkoda: add wake-up via charging/start

  - Optimizer: add automatic mode

  - RCT: add S0 external energy

  - SENEC Connect: add .Home V4 product

  - Sofar G3: add battery discharge mode

  - Stiebel WPM: add target temperature

  - Sungrow Hybrid: Add voltage and power registers for Modbus

  - …


  Full release notes: https://github.com/evcc-io/evcc/releases/tag/0.318.0

