id: hkdkfih-feishin
category: media
name: Feishin
version: "1.17.0"
tagline: A modern music player for Navidrome, Jellyfin and Subsonic
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-feishin/icon.png
description: >-
  Feishin is a beautiful, modern player for your self-hosted music library. It connects to Navidrome, Jellyfin
  or any OpenSubsonic-compatible server and gives you a fast, desktop-class listening experience right in the
  browser.


  - Home page with recently played, most played and new music

  - Full-screen player with synced lyrics and album art

  - Smart playlists, queue management and gapless playback

  - Fast search across artists, albums and tracks

  - Light and dark themes, plus extensive customisation


  Feishin is pre-configured for the Navidrome app on your Umbrel: just log in with your Navidrome username and
  password. To use Jellyfin or another server instead, choose it on the login screen. When you open Feishin over
  https or remotely, change the server address to one your browser can reach the same way. Feishin itself stores no
  data; your library stays on your music server.
