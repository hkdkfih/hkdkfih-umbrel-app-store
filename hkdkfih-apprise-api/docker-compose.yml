version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-apprise-api_server_1
      APP_PORT: 8000
      PROXY_AUTH_WHITELIST: "/notify/*"

  server:
    image: caronc/apprise:2.1.0@sha256:bd7dc73b75882326b97d2963b7c3dd2a5e033df27d84c51f0090465d583fb316
    restart: on-failure
    environment:
      PUID: 1000
      PGID: 1000
      APPRISE_STATEFUL_MODE: simple
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/attach:/attach
