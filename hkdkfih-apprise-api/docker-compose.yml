version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-apprise-api_server_1
      APP_PORT: 8000
      PROXY_AUTH_WHITELIST: "/notify/*"

  server:
    image: caronc/apprise:2.2.0@sha256:8a7654c329ce3821848b8052ba915bcf5a3e02dd3ce817c8fa1427fb60bdeae7
    restart: on-failure
    environment:
      PUID: 1000
      PGID: 1000
      APPRISE_STATEFUL_MODE: simple
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/attach:/attach
