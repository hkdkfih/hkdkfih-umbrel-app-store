version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-apprise-api_server_1
      APP_PORT: 8000
      PROXY_AUTH_WHITELIST: "/notify/*"

  server:
    image: caronc/apprise:2.0.2@sha256:6ae97e24b3447f85f725a03ba73c6dc3a5f4b99f4273ac126de2d9b5ed6205d5
    restart: on-failure
    environment:
      PUID: 1000
      PGID: 1000
      APPRISE_STATEFUL_MODE: simple
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/attach:/attach
