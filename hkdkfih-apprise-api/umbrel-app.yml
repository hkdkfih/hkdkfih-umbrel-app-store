manifestVersion: 1
id: hkdkfih-apprise-api
storage:
  dataRoot: data
category: automation
name: Apprise API
version: "2.2.0"
tagline: Send notifications to 100+ services from one API
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-apprise-api/icon.png
description: >-
  Save a configuration (your notification URLs) under a key in the web UI, then send notifications to http://umbrel.local:22012/notify/<key> from your scripts, Home Assistant or other apps.


  Apprise API puts the Apprise notification library behind a simple web API. One request reaches Telegram, Discord, Slack, email, ntfy, Gotify, Pushover, Matrix, Signal and more than 100 other services.


  - Store notification targets under keys and tags

  - Simple REST API, compatible with Home Assistant

  - Attachments and Markdown formatting

  - Test notifications from the browser


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 128 MB → 256 MB

  Storage: 200 MB → 500 MB
releaseNotes: >-
  - This release introduces Reminders :clock10: ! You can now set and forget your reminders. The mobile app being launched soon will also help support these scheduled reminders at the palm of your hand from anywhere.

  - Added Reminder/Task support to Apprise - Set it and Forget it! :slightly_smiling_face:

  - By Date

  - Date Range (recurring notifications)

  - By Holiday too!


  bulb: Features


  - Updated to reflect new iOS/Apple Mobile support in

  - :fire: Reminders/Tasks Support Added /reminder/ in

  - Refresh reminder buttons and update libraries in

  - Add an auto theme that follows the system light or dark setting in

  - Allow APPRISE_ASSET_* variables to set any Apprise asset option in


  Full release notes: https://github.com/caronc/apprise-api/releases/tag/v2.2.0

developer: Chris Caron
