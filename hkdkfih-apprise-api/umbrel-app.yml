manifestVersion: 1
id: hkdkfih-apprise-api
storage:
  dataRoot: data
category: automation
name: Apprise API
version: "2.0.2"
tagline: Send notifications to 100+ services from one API
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-apprise-api/icon.png
description: >-
  Save a configuration (your notification URLs) under a key in the web UI, then send notifications to http://umbrel.local:22012/notify/<key> from your scripts, Home Assistant or other apps.


  Apprise API puts the Apprise notification library behind a simple web API. One request reaches Telegram, Discord, Slack, email, ntfy, Gotify, Pushover, Matrix, Signal and more than 100 other services.


  - Store notification targets under keys and tags

  - Simple REST API, compatible with Home Assistant

  - Attachments and Markdown formatting

  - Test notifications from the browser


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 128 MB → 256 MB

  Storage: 200 MB → 500 MB
releaseNotes: >-
  - A small release to point against the new Apprise v2.1.0 release


  bulb: Features


  - Accept plain text message bodies and X-Apprise-* headers on notify in

  - reduce restrictions on saving config entries in


  heart: Life-Cycle Support


  - Docker support for AMQP v1.0 and v0.9.1 in

  - Updated to support terramaster privacy req in

  - Centralize Apprise API version for runtime and package metadata


  Full release notes: https://github.com/caronc/apprise-api/releases/tag/v2.0.2

