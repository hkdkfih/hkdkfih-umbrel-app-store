manifestVersion: 1
id: hkdkfih-lychee
storage:
  dataRoot: data
category: media
name: Lychee
version: "7.12.0"
tagline: A great looking and easy-to-use photo management system
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-lychee/icon.png
description: >-
  On first launch, Lychee asks you to create the administrator account in the browser. Choose a username and a
  password of at least 8 characters.


  Lychee is a free photo-management tool that runs on your own server. Upload, manage and share photos like
  from a native application, with everything stored on your Umbrel.


  - Albums, nested albums and smart albums (recent, starred, on this day)

  - Justified, masonry, grid and timeline layouts

  - Photo details with EXIF data, tags, maps and live photos

  - Share albums publicly, with a password or with other users

  - Import from your computer, a URL or a server folder, with duplicate detection

  - Multiple users with upload quotas and permissions


  Photos are stored in the app's data on your Umbrel. To show public albums to people without an Umbrel
  account, turn off "Require Umbrel login" in the app's settings; your private albums stay protected by your
  Lychee login.


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 1 GB → 2 GB

  Storage: 2 GB → 50 GB

  Note: Storage grows with your photo library
releaseNotes: >-
  🏕 Features


  - Ensure that config always have translation keys

  - Add support for email login

  - Worktree moderation history

  - Translations [AI GENERATED] - if you are native speaker, we do accept pull requests ;)

  - Bucketing refactor

  - Translations update from LycheeOrg - Weblate

  - Support Vite+

  - open-new-tab

  - Add tag-person album section

  - fix(photo): scroll PDF pages instead of changing photo

  - Fixes the link in CONTRIBUTING.md

  - Claude is just a tool, however we expect you to understand what you write

  - Google Motion Photos: Android 11+ format and grid hover playback

  - Jxl support

  - Fixes PHP RCE CVE-2026-109618 and CVE-2026-109619 in the Docker image

  - speed up thumb loading

  - Migrate from debian-slim to php base image

  - Version 7.11.2


  👒 Dependencies


  Full release notes: https://github.com/LycheeOrg/Lychee/releases/tag/v7.12.0

