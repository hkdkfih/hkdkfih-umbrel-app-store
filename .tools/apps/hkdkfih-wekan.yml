# Upstream lists no hardware requirements (wekan.fi/install); estimate for a small team running
# the Node.js server with the bundled FerretDB/SQLite database.
requirements:
  minimum: {cpu: "1 core", memory: "1 GB", storage: "2 GB"}
  recommended: {cpu: "2 cores", memory: "2 GB", storage: "10 GB"}
  notes: ["Storage grows with card attachments"]
