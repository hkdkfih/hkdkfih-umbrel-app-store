repo: wekan/wekan
images:
  - image: ghcr.io/wekan/wekan
    tag: "v{version}"
icon: https://raw.githubusercontent.com/wekan/wekan/v12.28/public/android/android-launchericon-512-512.png
screenshots:
  - src: https://wekan.fi/wekan-board-views.png
    caption: "Every view your team needs."
  - src: https://raw.githubusercontent.com/wekan/wekan/v12.28/public/screenshot1.webp
    caption: "Swimlanes, labels and Markdown."
