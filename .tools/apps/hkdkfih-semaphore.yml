# Upstream gives no figures (semaphore-docs docs/introduction/prerequisites.md: size the host for the
# playbooks you run, not for Semaphore); estimate for a home lab running a few tasks at a time.
requirements:
  minimum: {cpu: "1 core", memory: "512 MB", storage: "2 GB"}
  recommended: {cpu: "2 cores", memory: "2 GB", storage: "10 GB"}
  notes: ["CPU and memory scale with the tasks you run in parallel"]
