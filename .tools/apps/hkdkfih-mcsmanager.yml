# Upstream documents no hardware requirements; estimate for one or two small Minecraft servers.
# The panel itself is light; each game server needs its own RAM (Minecraft: 2-4 GB).
requirements:
  minimum: {cpu: "2 cores", memory: "2 GB", storage: "5 GB"}
  recommended: {cpu: "4 cores", memory: "8 GB", storage: "20 GB"}
  notes: ["Each Minecraft server needs 2-4 GB of RAM", "Storage grows with worlds and backups"]
