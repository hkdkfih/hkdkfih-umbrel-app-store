version: "3.7"

services:
  server:
    image: koush/scrypted:v0.147.0-noble-full@sha256:e78b4fcecdd6c61acaaf22b50ccef303c738da58cc0be57afdb116521df52296
    # container runs as root (upstream image requirement)
    # Host networking is required for HomeKit (mDNS), camera discovery (ONVIF) and
    # low-latency local streaming. The web UI listens on port 11080.
    network_mode: host
    environment:
      # Upstream's default HTTPS port 10443 is published by the official Stalwart app.
      SCRYPTED_SECURE_PORT: 11443
    volumes:
      - ${APP_DATA_DIR}/data/volume:/server/volume
    restart: on-failure
    stop_grace_period: 1m
