version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-dashy_server_1
      APP_PORT: 8080

  server:
    image: lissy93/dashy:4.9.0@sha256:e8725dc24acc9a1d6f09c2ed0499b596af5a1b4eac8c83e912c213da06011356
    # container runs as root (upstream default)
    restart: on-failure
    stop_grace_period: 1m
    environment:
      NODE_ENV: production
    volumes:
      - ${APP_DATA_DIR}/data/user-data:/app/user-data
