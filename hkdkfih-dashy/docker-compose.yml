version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-dashy_server_1
      APP_PORT: 8080

  server:
    image: lissy93/dashy:4.10.0@sha256:c181b9d1fdfce269546755c4456f63152d3690dac80fb32d159053089bcc8199
    # container runs as root (upstream default)
    restart: on-failure
    stop_grace_period: 1m
    environment:
      NODE_ENV: production
    volumes:
      - ${APP_DATA_DIR}/data/user-data:/app/user-data
