manifestVersion: 1
id: hkdkfih-dashy
storage:
  dataRoot: data
category: files
name: Dashy
version: "4.9.0"
tagline: A self-hostable personal dashboard for your homelab
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-dashy/icon.png
description: >-
  Open Dashy and click the edit (pencil) icon to add your own sections and links, or edit conf.yml in the app's data folder via Files.


  Dashy helps you organise your self-hosted services by making them accessible from a single place. Build a start page with sections, links, icons and widgets, then switch themes and layouts in one click.


  - Status checks show which of your services are up

  - 50+ widgets for weather, crypto, system stats and more

  - Instant search, keyboard shortcuts and multiple pages

  - Dozens of themes, plus a visual editor to customise everything


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 256 MB → 512 MB

  Storage: 300 MB → 1 GB
releaseNotes: >-
  ✨ New Features


  - Add option to open workspace sidebar items in new tab

  - Shiny new workspace view


  🦋 Bug Fixes


  - Fix config files being readable without login via encoded URLs

  - Fix Firefix col counting, and rss in sample config


  🎨 Themes and Styling


  - feat(theme): add liquid-glass built-in theme


  🌐 Localization


  - Complete Arabic translation and fix broken Hindi placeholders

  - Complete and polish Chinese (zh-CN) translations


  📕 Documentation


  - Add warning guest access http auth

  - Updates troubleshooting guide

  - Adds translation credits to the readme

  - Update sponsors in readme


  📦 Dependencies


  Full release notes: https://github.com/lissy93/dashy/releases/tag/4.9.0

developer: Alicia Sykes
website: https://dashy.to/
dependencies: []
repo: https://github.com/Lissy93/dashy
