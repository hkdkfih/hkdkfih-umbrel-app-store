manifestVersion: 1
id: hkdkfih-dashy
storage:
  dataRoot: data
category: files
name: Dashy
version: "4.10.0"
tagline: A self-hostable personal dashboard for your homelab
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-dashy/icon.png
description: >-
  Open Dashy and click the edit (pencil) icon to add your own sections and links, or edit conf.yml in the app's data folder via Files.


  Dashy helps you organise your self-hosted services by making them accessible from a single place. Build a start page with sections, links, icons and widgets, then switch themes and layouts in one click.


  - Status checks show which of your services are up

  - 50+ widgets for weather, crypto, system stats and more

  - Instant search, keyboard shortcuts and multiple pages

  - Dozens of themes, plus a visual editor to customise everything


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 256 MB → 512 MB

  Storage: 300 MB → 1 GB
releaseNotes: >-
  ✨ New Features


  - Set color for item icons, without applying it to icon text


  🦋 Bug Fixes


  - Fixes NextCloud widget crash on tralsation

  - fix: accept IPv6 connections by default

  - Fix workspace header and search

  - Security fix for when using auth headers with lookalike origins

  - Fix theme flash and sub-page styles

  - Fixes OIDC re-login losing the requested page

  - Fixes header auth for unlisted users

  - Fixes a slow sub-page load replacing the page navigated to

  - Fixes basic auth env placeholders


  🌐 Localization


  - Update Azerbaijani (az) workspace and video labels


  📕 Documentation


  - Update widgets.md | fix sabnzbd docu


  🛠️ Build, CI and Refactors


  📦 Dependencies


  Full release notes: https://github.com/lissy93/dashy/releases/tag/4.10.0

developer: Alicia Sykes
