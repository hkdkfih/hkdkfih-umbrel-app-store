manifestVersion: 1
id: hkdkfih-sillytavern
storage:
  dataRoot: data
category: ai
name: SillyTavern
version: "1.19.1"
tagline: LLM frontend for power users
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-sillytavern/icon.png
description: >-
  SillyTavern is protected by your Umbrel login. If you turn off "Require Umbrel login" in the app's settings,
  enable user accounts or basic authentication in SillyTavern first.


  SillyTavern is a locally installed interface for chatting and roleplaying with text generation models,
  image generators and TTS voices. It connects to the AI provider of your choice, including Ollama on your
  Umbrel, OpenAI, Claude, Gemini, OpenRouter, KoboldCpp and many more.


  - Character cards, group chats, personas and world info (lorebooks)

  - Fine-grained prompt control with presets, instruct and context templates

  - Chat branching, swipes, bookmarks and message editing

  - Image generation, text-to-speech, translation and vector-storage extensions

  - Visual novel mode, themes and a highly customisable UI


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 512 MB → 2 GB

  Storage: 1 GB → 5 GB

  Note: AI models run elsewhere (API or Ollama)
releaseNotes: >-
  SillyTavern 1.19.1


  - A small patch release with security and robustness fixes. Updating is recommended for everyone.


  Fixes


  - Fixed the handling of blocks in chat messages and creator notes, which could let crafted content from a character card, an imported chat or a model response run scripts in the app.

  - Fixed CharX and BYAF imports of characters with an unusable name placing asset files next to other character cards, where they could replace them.

  - Fixed the user backup and delete endpoints accepting handles that are not existing users.

  - Security advisories with details will be published alongside this release. Thanks to the researchers who reported these issues.


  Full release notes: https://github.com/SillyTavern/SillyTavern/releases/tag/1.19.1

