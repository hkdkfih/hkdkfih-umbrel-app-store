version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-traccar_server_1
      APP_PORT: 8082

  server:
    image: traccar/traccar:6.17.0@sha256:b32d9346adf46df7c33c58577e17ad60f6feadd1f3cd87c876041f6c79317ef1
    # container runs as root (upstream default)
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "15055:5055" # OsmAnd protocol, used by the Traccar Client phone app
    volumes:
      - ${APP_DATA_DIR}/data/data:/opt/traccar/data
      - ${APP_DATA_DIR}/data/media:/opt/traccar/media
      - ${APP_DATA_DIR}/data/logs:/opt/traccar/logs
