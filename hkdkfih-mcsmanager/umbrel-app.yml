manifestVersion: 1
id: hkdkfih-mcsmanager
storage:
  dataRoot: data
category: media
name: MCSManager
version: "10.22.1"
tagline: A web panel for running Minecraft and other game servers
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-mcsmanager/icon.png
description: >-
  On first launch, create the administrator account in the browser. The Umbrel node is already connected, so you
  can create your first server right away from the Instances page, for example with the Minecraft quick-install
  templates.


  Players connect to a Minecraft Java server at umbrel.local:21403 (server port 25565 inside the app) and to a
  Bedrock server at umbrel.local:21404 (port 19132). For more servers, set the server's port to 21405, 21406 or
  21407 and players use that same port.


  MCSManager is a fast, multi-user web panel for game servers. Install Minecraft servers in a few clicks, watch
  and type into their consoles live, edit their files and schedule restarts and backups, all from the browser.


  - Quick-install templates for popular Minecraft Java and Bedrock servers

  - Live web console, file manager with upload and download, and scheduled tasks

  - Built-in Java manager to download the Java version a server needs

  - Multiple users with per-instance permissions

  - Run any other command-line server program as an instance


  On Umbrel, servers run as processes inside the app (without Docker), so Docker-based instances and templates
  are not available. Servers share your Umbrel's CPU and memory: a Minecraft server typically needs 2 to 4 GB
  of RAM.


  System requirements (minimum → recommended)

  CPU: 2 cores → 4 cores

  Memory: 2 GB → 8 GB

  Storage: 5 GB → 20 GB

  Note: Each Minecraft server needs 2-4 GB of RAM

  Note: Storage grows with worlds and backups
releaseNotes: >-
  - Fixed a bug in the mod manager. Thanks to @Q3CC for reporting it.

  - Added a generic console program option to app market templates for users to choose from later.


  Required Daemon Version


  - > No update needed. Any 4.19.X version works.


  更改


  - 修复模组管理器 BUG，感谢 @Q3CC 反馈。

  - 应用市场模板新增一个通用控制台程序选项，方便后续用户选择。


  所需的 Daemon 版本


  - > 无需更新，4.19.X 均可


  Full release notes: https://github.com/MCSManager/MCSManager/releases/tag/v10.22.1

