version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-peanut_web_1
      APP_PORT: 8080

  web:
    image: brandawg93/peanut:6.1.2@sha256:13e99d1fd1b599c41f18c51483c53a8ee4f5a1da64c1a67b6e66d6a265be111b
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      WEB_PORT: 8080
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
