version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-peanut_web_1
      APP_PORT: 8080

  web:
    image: brandawg93/peanut:6.2.0@sha256:b6bf626143cff8bc2797dd42cb7b231de833fa9fda9b770321c623c71433ec28
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      WEB_PORT: 8080
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
