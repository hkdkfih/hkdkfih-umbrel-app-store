version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-peanut_web_1
      APP_PORT: 8080

  web:
    image: brandawg93/peanut:6.1.0@sha256:e5f2fbce02e1912e984be738a206255d8ab51632e6327d1a06b06dc1bb82231e
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      WEB_PORT: 8080
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
