version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-peanut_web_1
      APP_PORT: 8080

  web:
    image: brandawg93/peanut:6.1.1@sha256:974c485e25df4d4031e1a1a430cc595d7e0eabe3be3207233e9ad4432e0811be
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      WEB_PORT: 8080
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
