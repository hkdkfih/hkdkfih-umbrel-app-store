manifestVersion: 1
id: hkdkfih-peanut
storage:
  dataRoot: data
category: networking
name: PeaNUT
version: "6.1.0"
tagline: A tiny dashboard for your UPS
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-peanut/icon.png
description: >-
  On first launch, add your NUT server (Network UPS Tools) in PeaNUT's settings, for example a Synology, a
  Raspberry Pi or a NAS that your UPS is connected to.


  PeaNUT is a small dashboard for Network UPS Tools. See battery charge, load, runtime and input voltage of
  your uninterruptible power supplies at a glance, and keep an eye on several UPS devices at once.


  - Live gauges for battery, load and runtime

  - Charts of voltage and power over time

  - Full table of every value your UPS reports

  - Run UPS commands and edit variables

  - Prometheus metrics and a Homepage/Glance-friendly API


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 128 MB → 256 MB

  Storage: 200 MB → 500 MB

  Note: Needs a NUT server your UPS is connected to
releaseNotes: >-
  - Parallelize metrics fetch and consolidate Influx points

  - Fix auth.yaml writing to wrong location

  - Consolidate e2e tests and scope API tests to a single project

  - Raise unit test coverage and enforce a CI floor

  - Add Korean (ko) translation

  - Update dependencies (low-risk batch + individually-vetted major bumps)

  - Tune Jest/Playwright CI and add e2e coverage

  - Fix deploy:test Docker build by pinning pnpm version

  - Add Indonesian (id) translation

  - Add Japanese (ja) translation

  - Fix #464: forward NUT credentials through getCachedRWVars so LIST RW is sent


  Full release notes: https://github.com/Brandawg93/PeaNUT/releases/tag/v6.1.0

