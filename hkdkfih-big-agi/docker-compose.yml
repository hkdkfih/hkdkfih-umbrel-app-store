version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-big-agi_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/enricoros/big-agi:v2.1.2@sha256:174492f7d895fc3d1b20ea05048b5791b60ec160f964cd5f26f475a4c39308cb
    # runs as the image's non-root "nextjs" user; chats, settings and API keys live in the browser,
    # so the server keeps no state and needs no volume
    restart: on-failure
    stop_grace_period: 1m
