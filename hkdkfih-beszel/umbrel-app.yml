manifestVersion: 1
id: hkdkfih-beszel
storage:
  dataRoot: data
category: networking
name: Beszel
version: "0.21.2"
tagline: Lightweight server monitoring with history and alerts
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-beszel/icon.png
description: >-
  Beszel on Umbrel is a monitoring hub for your other computers. Click "Add System" and install the small
  Beszel agent on each server, PC or Raspberry Pi you want to watch. Your Umbrel's own CPU, memory and storage
  are already shown on the Umbrel dashboard.


  Beszel is a lightweight server monitoring platform with Docker statistics, historical data and alert
  functions. It has a friendly web interface, simple configuration and is ready to use out of the box.


  - CPU, memory, disk, network, temperature and GPU usage over time

  - Per-container CPU, memory and network statistics

  - Alerts for CPU, memory, disk, bandwidth, temperature and system status

  - Multiple users, with systems shared between them

  - Agents connect over WebSocket to http://umbrel.local:8490, or the hub connects to them over SSH


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 128 MB → 512 MB

  Storage: 200 MB → 2 GB
releaseNotes: >-
  - Add an actions menu with alert settings to the system detail page

  - Add FAN_SENSORS to include or exclude fan sensors

  - Add styled HTML alert emails

  - Add no_self_update build tag to disable hub and agent self-updates

  - Add warnings for missing automatic login users and trusted proxy configuration (#2824, #2812)

  - Add video encode/decode engine usage to GPU metrics when using nvtop

  - Limit sign-in attempts to 10 per minute per address

  - Improve GPU collection retries and back off slow or repeatedly failing reads (#2705, #2687, #2709, #2656)

  - Fix hub crashes caused by null entries in agent data

  - Fix agent health checks incorrectly reporting disconnected agents as healthy

  - Fix agent connections timing out while waiting for a slow hub

  - Fix container requests being canceled by requests for other systems

  - …


  Full release notes: https://github.com/henrygd/beszel/releases/tag/v0.21.2

developer: henrygd
website: https://beszel.dev/
dependencies: []
repo: https://github.com/henrygd/beszel
