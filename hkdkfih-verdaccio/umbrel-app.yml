manifestVersion: 1
id: hkdkfih-verdaccio
storage:
  dataRoot: data
category: developer
name: Verdaccio
version: "7.0.1"
tagline: A lightweight private npm proxy registry
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-verdaccio/icon.png
description: >-
  Log in to the web interface with the username and password shown by Umbrel. Point npm, yarn or pnpm at
  the registry port 21602 and log in with the same account, for example:
  npm login --registry http://umbrel.local:21602/


  Verdaccio is a simple, zero-config private npm registry with its own tiny database. Publish private
  packages on your own server and cache everything you install from npmjs.org, so installs stay fast and
  keep working when the internet does not.


  - Publish and install private and scoped packages

  - Caches packages from npmjs.org (and any other registry you add as an uplink)

  - Works with npm, yarn, pnpm and other npm clients

  - Web interface to browse packages, readmes, versions and dependencies

  - Access rules per package or scope


  On Umbrel every package, including cached public ones, requires a login, and self-registration is
  turned off. Uplinks and package rules can be changed in config.yaml in the app's data folder (data/conf).


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 256 MB → 1 GB

  Storage: 1 GB → 20 GB

  Note: Storage grows with every package you publish or cache from npmjs.org
releaseNotes: >-
  Patch Changes


  - Restore the @verdaccio/package-filter plugin in the verdaccio 7 package so the filter configuration works again.

  - Verdaccio 7.0.0 shipped a default config.yaml (also the one inside the verdaccio/verdaccio:7 Docker image) with the filters: '@verdaccio/package-filter' section enabled, but the package no longer declared the plugin as a dependency: it was dropped when the 7.x line moved to the published @verdaccio/* modules. On startup the plugin loader logged package not found, try to install @verdaccio/package-filter with a package manager and continued without it, so any minAgeDays, dateThreshold or block rules configured under filters were silently not enforced.

  - …


  Full release notes: https://github.com/verdaccio/verdaccio/releases/tag/v7.0.1

