manifestVersion: 1
id: hkdkfih-open-notebook
storage:
  dataRoot: data
category: ai
name: Open Notebook
version: "1.15.1"
tagline: A private, open source alternative to Google NotebookLM
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-open-notebook/icon.png
description: >-
  Open Notebook needs an AI provider. After launching it, open Manage → Models and add a provider key
  (OpenAI, Anthropic, Google, OpenRouter and more) or connect Ollama running on your Umbrel.


  Open Notebook is a privacy-focused research assistant inspired by Google NotebookLM. Collect PDFs, web pages,
  videos, audio and notes into notebooks, then chat with them, generate summaries and insights, and turn them
  into multi-speaker podcasts, all on your own server.


  - Supports 16+ AI providers, including fully local models through Ollama

  - Add PDFs, web pages, YouTube videos, audio, Office documents and plain text

  - Chat with your sources with citations, and full-text and vector search

  - Transformations to summarise, extract key points or build your own prompts

  - Podcast generation with one to four speakers

  - REST API for automations


  Your provider keys are stored encrypted in the app's database on your Umbrel.


  System requirements (minimum → recommended)

  CPU: 2 cores → 4 cores

  Memory: 2 GB → 4 GB

  Storage: 5 GB → 20 GB

  Note: Plus an AI provider or Ollama for the models
releaseNotes: >-
  - Security release — we recommend all users upgrade. v1.15.1 closes gaps in how sources are processed and requires content-core 2.2.1, which hardens URL fetching. It also ships the documentation rewrite and a handful of small fixes. Validated with the backend and frontend suites and a hands-on pass over the published 1.15.1 image.


  🔒 Security


  - Source processing now enforces the uploads-directory and URL checks in the background worker itself, so they apply on every path that processes a source, not only when a source is created.

  - Requires content-core 2.2.1 or later, which refuses link-local and cloud-metadata addresses on every redirect hop when fetching URLs.

  - POST /api/commands/jobs, the generic "submit any background command" endpoint, is removed. Nothing in Open Notebook used it; every operation has its own endpoint. Job status (GET /api/commands/jobs/{job_id}) is unchanged.

  - …


  Full release notes: https://github.com/lfnovo/open-notebook/releases/tag/v1.15.1

