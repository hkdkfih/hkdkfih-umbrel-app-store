manifestVersion: 1
id: hkdkfih-bytestash
storage:
  dataRoot: data
category: developer
name: ByteStash
version: "1.6.0"
tagline: Store and organise your code snippets
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-bytestash/icon.png
description: >-
  On first launch, click "Register" to create your account.


  ByteStash is a self-hosted home for your code snippets. Save, search and share the commands, scripts and configs you keep looking up.


  - Syntax highlighting for hundreds of languages

  - Multiple code fragments per snippet, with categories

  - Fast search and filtering

  - Public or private share links, with expiry


  System requirements (minimum → recommended)

  CPU: 1 core

  Memory: 128 MB → 256 MB

  Storage: 200 MB → 1 GB
releaseNotes: >-
  - [feat] optional postgres support with sqlite migration

  - [bug] keep search bar and url in sync when selecting a hashtag category

  - [feat] word wrap

  - [feat] secure session cookie

  - [sec] stop exposing recycled snippets on the public api


  Full release notes: https://github.com/jordan-dalby/ByteStash/releases/tag/v1.6.0

