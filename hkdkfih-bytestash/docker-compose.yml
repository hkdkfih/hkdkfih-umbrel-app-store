version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-bytestash_server_1
      APP_PORT: 5000

  server:
    image: ghcr.io/jordan-dalby/bytestash:1.6.1@sha256:2c79156850340eeff4e76bbb81e3aab78b42e40509cf2af0acdb18682e579cf1
    # container runs as root (upstream default)
    restart: on-failure
    environment:
      JWT_SECRET: ${APP_HKDKFIH_BYTESTASH_JWT_SECRET}
      TOKEN_EXPIRY: 24h
      ALLOW_NEW_ACCOUNTS: "true"
    volumes:
      - ${APP_DATA_DIR}/data/snippets:/data/snippets
