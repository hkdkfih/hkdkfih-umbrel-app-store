version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-bytestash_server_1
      APP_PORT: 5000

  server:
    image: ghcr.io/jordan-dalby/bytestash:1.6.0@sha256:4326e143e2bd4a0fe4a360d58a86c95ef47d67a7bf8ced8eb830ac257dd89844
    # container runs as root (upstream default)
    restart: on-failure
    environment:
      JWT_SECRET: ${APP_HKDKFIH_BYTESTASH_JWT_SECRET}
      TOKEN_EXPIRY: 24h
      ALLOW_NEW_ACCOUNTS: "true"
    volumes:
      - ${APP_DATA_DIR}/data/snippets:/data/snippets
