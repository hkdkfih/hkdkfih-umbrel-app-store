version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hkdkfih-bytestash_server_1
      APP_PORT: 5000

  server:
    image: ghcr.io/jordan-dalby/bytestash:1.6.2@sha256:86d5726ef9a417775cc05120eed04c36915cbc41aea83c5799fc6b8d3ad77db5
    # container runs as root (upstream default)
    restart: on-failure
    environment:
      JWT_SECRET: ${APP_HKDKFIH_BYTESTASH_JWT_SECRET}
      TOKEN_EXPIRY: 24h
      ALLOW_NEW_ACCOUNTS: "true"
    volumes:
      - ${APP_DATA_DIR}/data/snippets:/data/snippets
