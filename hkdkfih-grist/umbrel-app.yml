name: Grist
version: "1.7.22"
tagline: The evolution of spreadsheets
icon: https://raw.githubusercontent.com/hkdkfih/hkdkfih-umbrel-app-store/master/gallery/hkdkfih-grist/icon.png
description: >-
  Grist is a modern relational spreadsheet. It combines the flexibility of a spreadsheet with the robustness of
  a database, so you can organise your data, build custom tools and collaborate without writing an app.


  - Columns have types, and tables link to each other like a database

  - Formulas in Python, with the full standard library and an AI formula assistant (bring your own key)

  - Custom layouts with cards, charts, forms, calendars and custom widgets

  - Fine-grained access rules down to individual rows and columns

  - Import from and export to Excel, CSV and Google Sheets

  - Hundreds of templates for CRMs, inventories, budgets and project trackers


  Grist opens as a single-user workspace protected by your Umbrel login. Formulas run in a WebAssembly
  sandbox. To invite other people with their own accounts, configure authentication in Grist's Admin Panel.


  System requirements (minimum → recommended)

  CPU: 1 core → 2 cores

  Memory: 512 MB → 8 GB

  Storage: 1 GB → 20 GB
releaseNotes: >-
  New features


  - Widget Creator. "Create your own" in the widget picker opens a code editor with a live preview, for writing a widget's HTML and JavaScript right in the document. Errors from the code show under the widget. Widgets made with the old Custom Widget Builder can switch over and keep their code. See the Widget Creator docs


  Improvements


  - Sorting

  - Under "More sort options", empty values can go first or last in any column. The old "Empty values last" did nothing on Date, Numeric, or Reference columns, where empties already sorted last. Existing saved sorts keep their order

  - Calendar

  - In a narrow calendar widget, the toolbar wraps onto more lines instead of scrolling sideways, and the date title gets a line of its own below the buttons

  - Imports

  - …


  Full release notes: https://github.com/gristlabs/grist-core/releases/tag/v1.7.22

